<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>색 칸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1814;
      --board: #d8c8a8;
      --floor: #cbb892;
      --red: #d62828;
      --blue: #1d6fd8;
      --green: #2f9e44;
      --yellow: #f4c430;
      --btn: #1c1814;
      --btn-text: #efe6d4;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "IBM Plex Sans KR", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, #fff6e4 0%, transparent 42%),
        radial-gradient(circle at 85% 80%, #d7ecff 0%, transparent 40%),
        linear-gradient(160deg, #f3e7cf 0%, #e4f0e2 48%, #d9e8f5 100%);
      overflow: hidden;
    }
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .screen.on { display: flex; }
    .lobby, .center-box {
      width: min(520px, 100%);
      text-align: center;
    }
    .lobby h1, .center-box h2 {
      margin: 0 0 12px;
      font-family: "Black Han Sans", sans-serif;
      letter-spacing: -0.02em;
      line-height: 0.95;
    }
    .lobby h1 { font-size: clamp(56px, 14vw, 92px); }
    .center-box h2 { font-size: clamp(40px, 10vw, 64px); color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,0.25); }
    .lobby p, .center-box p {
      margin: 0 auto 28px;
      max-width: 400px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.55;
    }
    .lobby p { opacity: 0.85; }
    .center-box p { color: #fff; font-weight: 700; }
    .play {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 16px 42px;
      font: 700 20px/1 "IBM Plex Sans KR", sans-serif;
      color: var(--btn-text);
      background: var(--btn);
      cursor: pointer;
      box-shadow: 0 10px 0 #8a7a5e;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .play:hover { transform: translateY(-2px); box-shadow: 0 12px 0 #8a7a5e; }
    .play:active { transform: translateY(6px); box-shadow: 0 4px 0 #8a7a5e; }
    .game-wrap {
      width: min(760px, 100%);
      display: grid;
      gap: 10px;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hud h2 {
      margin: 0;
      font-family: "Black Han Sans", sans-serif;
      font-size: 24px;
    }
    .pill {
      font-weight: 700;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(28, 24, 20, 0.08);
    }
    .pill.mode {
      background: #1c1814;
      color: #efe6d4;
    }
    .pill.timer.warn { background: #d62828; color: #fff; }
    .msg {
      min-height: 22px;
      margin: 0;
      font-weight: 700;
      font-size: 14px;
    }
    .board {
      display: grid;
      gap: 4px;
      padding: 10px;
      border-radius: 18px;
      background: var(--board);
      box-shadow:
        inset 0 0 0 3px rgba(0, 0, 0, 0.08),
        0 14px 0 rgba(0, 0, 0, 0.12);
      aspect-ratio: 1;
      width: min(640px, 92vw);
      margin: 0 auto;
      user-select: none;
    }
    .cell {
      position: relative;
      border: 0;
      border-radius: 7px;
      background: var(--floor);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.08);
      cursor: default;
      padding: 0;
      touch-action: none;
    }
    .cell.red { background: #f3a4a4; box-shadow: inset 0 -3px 0 rgba(180, 40, 40, 0.25); }
    .cell.blue { background: #9ec5ff; box-shadow: inset 0 -3px 0 rgba(20, 80, 180, 0.25); }
    .cell.green { background: #9fdfae; box-shadow: inset 0 -3px 0 rgba(30, 120, 50, 0.25); }
    .cell.wall {
      background: #5a5248;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35);
      cursor: not-allowed;
    }
    .cell.drop-ok { outline: 2px solid #1c1814; outline-offset: -1px; }
    .cell.drop-bad { outline: 2px solid #d62828; outline-offset: -1px; }
    .block {
      position: absolute;
      inset: 16%;
      border-radius: 6px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      box-shadow:
        inset 0 -4px 0 rgba(0, 0, 0, 0.18),
        0 2px 0 rgba(0, 0, 0, 0.08);
      cursor: grab;
      touch-action: none;
      z-index: 1;
    }
    .block.red { background: linear-gradient(180deg, #ff5b5b, var(--red)); }
    .block.yellow { background: linear-gradient(180deg, #ffe066, var(--yellow)); }
    .block.locked { cursor: default; opacity: 0.95; }
    .block.dragging-source { opacity: 0.22; }
    .block.preview {
      opacity: 0.8;
      pointer-events: none;
      outline: 2px dashed rgba(28, 24, 20, 0.45);
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      opacity: 0.9;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }
    .dot.red { background: #f3a4a4; }
    .dot.blue { background: #9ec5ff; }
    .dot.green { background: #9fdfae; }
    .dot.wall { background: #5a5248; }
    .dot.block-red { background: var(--red); }
    .dot.block-yellow { background: var(--yellow); }
    .overlay {
      background: rgba(28, 24, 20, 0.35);
      backdrop-filter: blur(4px);
      flex-direction: column;
      gap: 18px;
    }
  </style>
</head>
<body>
  <section id="lobby" class="screen on">
    <div class="lobby">
      <h1>색 칸</h1>
      <p>1라운드는 연습입니다. 2라운드부터 벽·시간제한·한 칸 이동 같은 특수 라운드가 랜덤으로 나옵니다. 20라운드를 버티세요.</p>
      <button class="play" id="playBtn" type="button">플레이</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="game-wrap">
      <div class="hud">
        <h2>색 칸</h2>
        <div class="pill" id="roundLabel">라운드 1 / 20</div>
        <div class="pill mode" id="modeLabel">일반</div>
        <div class="pill" id="timerLabel" hidden>남은 시간 40</div>
      </div>
      <p class="msg" id="msg"></p>
      <div class="board" id="board" aria-label="게임 판"></div>
      <div class="legend">
        <span><i class="dot red"></i>빨간 칸</span>
        <span><i class="dot blue"></i>파란 칸</span>
        <span><i class="dot green"></i>초록 칸</span>
        <span><i class="dot wall"></i>벽</span>
        <span><i class="dot block-red"></i>빨간 블럭</span>
        <span><i class="dot block-yellow"></i>노란 블럭</span>
      </div>
    </div>
  </section>

  <section id="win" class="screen overlay">
    <div class="center-box">
      <h2>20라운드 클리어!</h2>
      <p>특수 라운드를 전부 버텼습니다.</p>
      <button class="play" id="againBtn" type="button">다시 플레이</button>
    </div>
  </section>

  <section id="fail" class="screen overlay">
    <div class="center-box">
      <h2>실패...</h2>
      <p id="failText">시간 초과로 처음부터 다시입니다.</p>
      <button class="play" id="retryBtn" type="button">다시 도전</button>
    </div>
  </section>

  <script>
    const W = 14;
    const H = 14;
    const TOTAL_ROUNDS = 20;
    const NEAR = 5;

    const MODES = {
      normal: {
        id: "normal",
        name: "일반",
        tip: "빨간 블럭 → 파란 칸 → 초록 칸",
        sets: 1,
        walls: 0,
        noFloor: false,
        adjacent: false,
        time: 0,
      },
      walls: {
        id: "walls",
        name: "벽 라운드",
        tip: "벽에 블럭을 올릴 수 없습니다",
        sets: 1,
        walls: 28,
        noFloor: false,
        adjacent: false,
        time: 0,
      },
      noFloor: {
        id: "noFloor",
        name: "색칸만",
        tip: "바닥에는 못 올립니다. 색 칸만 사용하세요",
        sets: 1,
        walls: 0,
        noFloor: true,
        adjacent: false,
        time: 0,
      },
      timed: {
        id: "timed",
        name: "시간 제한",
        tip: "시간이 끝나면 처음부터입니다",
        sets: 1,
        walls: 10,
        noFloor: false,
        adjacent: false,
        time: 35,
      },
      twin: {
        id: "twin",
        name: "쌍둥이",
        tip: "세트 2개를 모두 채우세요",
        sets: 2,
        walls: 0,
        noFloor: false,
        adjacent: false,
        time: 0,
      },
      chaos: {
        id: "chaos",
        name: "대혼란",
        tip: "세트 3개 + 벽",
        sets: 3,
        walls: 22,
        noFloor: false,
        adjacent: false,
        time: 0,
      },
      step: {
        id: "step",
        name: "한 칸 이동",
        tip: "상하좌우 옆 칸으로만 옮길 수 있습니다",
        sets: 1,
        walls: 8,
        noFloor: false,
        adjacent: true,
        time: 0,
      },
      hard: {
        id: "hard",
        name: "압박",
        tip: "색칸만 + 시간 제한",
        sets: 2,
        walls: 12,
        noFloor: true,
        adjacent: false,
        time: 45,
      },
    };

    const RANDOM_POOL = ["walls", "noFloor", "timed", "twin", "chaos", "step", "hard"];

    let tiles = [];
    let round = 1;
    let mode = MODES.normal;
    let messageTimer = 0;
    let drag = null;
    let timeLeft = 0;
    let timerAcc = 0;
    let timerOn = false;

    const lobby = document.getElementById("lobby");
    const game = document.getElementById("game");
    const win = document.getElementById("win");
    const fail = document.getElementById("fail");
    const board = document.getElementById("board");
    const msg = document.getElementById("msg");
    const roundLabel = document.getElementById("roundLabel");
    const modeLabel = document.getElementById("modeLabel");
    const timerLabel = document.getElementById("timerLabel");
    const failText = document.getElementById("failText");

    board.style.gridTemplateColumns = "repeat(" + W + ", 1fr)";

    function show(screen) {
      lobby.classList.toggle("on", screen === "lobby");
      game.classList.toggle("on", screen === "game");
      win.classList.toggle("on", screen === "win");
      fail.classList.toggle("on", screen === "fail");
    }

    function say(text) {
      msg.textContent = text;
      messageTimer = 120;
    }

    function xy(i) {
      return { x: i % W, y: Math.floor(i / W) };
    }

    function at(x, y) {
      return y * W + x;
    }

    function withinFive(a, b) {
      const pa = xy(a);
      const pb = xy(b);
      return Math.max(Math.abs(pa.x - pb.x), Math.abs(pa.y - pb.y)) <= NEAR;
    }

    function isAdjacent(a, b) {
      const pa = xy(a);
      const pb = xy(b);
      return Math.abs(pa.x - pb.x) + Math.abs(pa.y - pb.y) === 1;
    }

    function pickSpot(used) {
      for (let tryCount = 0; tryCount < 400; tryCount += 1) {
        const i = Math.floor(Math.random() * W * H);
        let near = false;
        for (let u = 0; u < used.length; u += 1) {
          if (withinFive(used[u], i)) {
            near = true;
            break;
          }
        }
        if (!near) return i;
      }
      return -1;
    }

    function makeEmptyTiles() {
      const list = [];
      for (let i = 0; i < W * H; i += 1) {
        list.push({ kind: "floor", block: null, index: i });
      }
      return list;
    }

    function chooseMode() {
      if (round === 1) return MODES.normal;
      const id = RANDOM_POOL[Math.floor(Math.random() * RANDOM_POOL.length)];
      return MODES[id];
    }

    function buildTutorialRound() {
      const next = makeEmptyTiles();
      const red = at(6, 11);
      const blue = at(6, 6);
      const green = at(6, 1);
      next[red].kind = "red";
      next[red].block = "red";
      next[blue].kind = "blue";
      next[green].kind = "green";
      return next;
    }

    function buildModeRound(m) {
      const used = [];
      const next = makeEmptyTiles();
      const setCount = m.sets;

      for (let n = 0; n < setCount; n += 1) {
        const green = pickSpot(used);
        if (green < 0) break;
        used.push(green);
        next[green].kind = "green";

        const blue = pickSpot(used);
        if (blue < 0) break;
        used.push(blue);
        next[blue].kind = "blue";

        const red = pickSpot(used);
        if (red < 0) break;
        used.push(red);
        next[red].kind = "red";
        next[red].block = "red";
      }

      let wallsLeft = m.walls;
      let guard = 0;
      while (wallsLeft > 0 && guard < 800) {
        guard += 1;
        const i = Math.floor(Math.random() * W * H);
        if (next[i].kind !== "floor") continue;
        next[i].kind = "wall";
        wallsLeft -= 1;
      }

      return next;
    }

    function goalFilled() {
      return tiles.every((t) => t.kind !== "green" || t.block === "yellow");
    }

    function isLocked(t) {
      return t.kind === "green" && t.block === "yellow";
    }

    function canPlace(color, t, fromIndex) {
      if (t.index === fromIndex) return true;
      if (t.kind === "wall") return false;
      if (t.block) return false;
      if (mode.adjacent && !isAdjacent(fromIndex, t.index)) return false;
      if (mode.noFloor && t.kind === "floor") return false;
      if (t.kind === "blue") return color === "red" || color === "yellow";
      if (t.kind === "green") return color === "yellow";
      if (t.kind === "red") return color === "red";
      if (t.kind === "floor") return true;
      return false;
    }

    function placeResult(color, t) {
      if (t.kind === "blue" && color === "red") {
        return { block: "yellow", text: "파란 칸! 블럭이 노랑으로 변했습니다." };
      }
      if (t.kind === "green" && color === "yellow") {
        return { block: "yellow", text: "초록 칸에 넣었습니다." };
      }
      return { block: color, text: "내려놓았습니다." };
    }

    function updateHud() {
      roundLabel.textContent = "라운드 " + round + " / " + TOTAL_ROUNDS;
      modeLabel.textContent = mode.name;
      if (mode.time > 0) {
        timerLabel.hidden = false;
        timerLabel.textContent = "남은 시간 " + Math.ceil(timeLeft);
        timerLabel.classList.toggle("warn", timeLeft <= 8);
      } else {
        timerLabel.hidden = true;
        timerLabel.classList.remove("warn");
      }
    }

    function stopTimer() {
      timerOn = false;
      timeLeft = 0;
    }

    function startTimer(seconds) {
      timeLeft = seconds;
      timerAcc = 0;
      timerOn = seconds > 0;
      updateHud();
    }

    function failRun(reason) {
      endDrag();
      stopTimer();
      failText.textContent = reason;
      show("fail");
    }

    function startRun() {
      round = 1;
      loadRound();
      show("game");
    }

    function loadRound() {
      endDrag();
      mode = chooseMode();
      tiles = round === 1 ? buildTutorialRound() : buildModeRound(mode);
      startTimer(mode.time);
      updateHud();
      renderBoard();
      say(mode.name + " · " + mode.tip);
    }

    function clearRound() {
      stopTimer();
      if (round >= TOTAL_ROUNDS) {
        show("win");
        return;
      }
      round += 1;
      loadRound();
    }

    function hoverIndex() {
      return drag ? drag.hover : null;
    }

    function renderBoard() {
      board.innerHTML = "";
      const hover = hoverIndex();
      for (let i = 0; i < tiles.length; i += 1) {
        const t = tiles[i];
        const cell = document.createElement("div");
        let cls = "cell " + t.kind;
        if (t.kind === "floor") cls = "cell";
        if (drag && hover === i) {
          cls += canPlace(drag.color, t, drag.from) ? " drop-ok" : " drop-bad";
        }
        cell.className = cls;
        cell.dataset.index = String(i);

        const showSource = t.block && !(drag && drag.from === i && hover !== null && hover !== i);
        if (showSource) {
          const b = document.createElement("div");
          const locked = isLocked(t);
          b.className = "block " + t.block + (locked ? " locked" : "");
          if (drag && drag.from === i) b.classList.add("dragging-source");
          if (!locked) {
            b.addEventListener("pointerdown", function (event) {
              startDrag(event, i);
            });
          }
          cell.appendChild(b);
        }

        if (drag && hover === i && hover !== drag.from && !t.block && t.kind !== "wall") {
          const preview = document.createElement("div");
          preview.className = "block preview " + drag.color;
          cell.appendChild(preview);
        }

        board.appendChild(cell);
      }
    }

    function cellUnder(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const cell = el.closest ? el.closest(".cell") : null;
      if (!cell || !board.contains(cell)) return null;
      return Number(cell.dataset.index);
    }

    function setHoverCell(idx) {
      if (!drag) return;
      if (drag.hover === idx) return;
      drag.hover = idx;
      renderBoard();
    }

    function startDrag(event, fromIndex) {
      if (drag) return;
      const t = tiles[fromIndex];
      if (!t.block || isLocked(t)) return;
      event.preventDefault();
      drag = {
        from: fromIndex,
        color: t.block,
        pointerId: event.pointerId,
        hover: fromIndex,
      };
      renderBoard();
      window.addEventListener("pointermove", onDragMove);
      window.addEventListener("pointerup", onDragEnd);
      window.addEventListener("pointercancel", onDragEnd);
    }

    function onDragMove(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      setHoverCell(cellUnder(event.clientX, event.clientY));
    }

    function onDragEnd(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const from = drag.from;
      const color = drag.color;
      const idx = drag.hover != null ? drag.hover : cellUnder(event.clientX, event.clientY);
      endDrag();

      if (idx == null) {
        say("판의 칸 위로 드래그하세요.");
        renderBoard();
        return;
      }
      if (idx === from) {
        renderBoard();
        return;
      }
      const target = tiles[idx];
      if (!canPlace(color, target, from)) {
        if (target.kind === "wall") say("벽에는 올릴 수 없습니다.");
        else if (mode.adjacent && !isAdjacent(from, idx)) say("옆 칸으로만 옮길 수 있습니다.");
        else if (mode.noFloor && target.kind === "floor") say("이 라운드는 바닥 금지입니다.");
        else if (target.kind === "green" && color !== "yellow") say("초록 칸에는 노란 블럭만 가능합니다.");
        else if (target.block) say("이미 블럭이 있는 칸입니다.");
        else say("여기에는 놓을 수 없습니다.");
        renderBoard();
        return;
      }

      tiles[from].block = null;
      const result = placeResult(color, target);
      target.block = result.block;
      say(result.text);
      renderBoard();
      if (goalFilled()) clearRound();
    }

    function endDrag() {
      drag = null;
      window.removeEventListener("pointermove", onDragMove);
      window.removeEventListener("pointerup", onDragEnd);
      window.removeEventListener("pointercancel", onDragEnd);
    }

    document.getElementById("playBtn").addEventListener("click", startRun);
    document.getElementById("againBtn").addEventListener("click", startRun);
    document.getElementById("retryBtn").addEventListener("click", startRun);

    let last = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (messageTimer > 0) {
        messageTimer -= 1;
        if (messageTimer === 0) msg.textContent = "";
      }
      if (timerOn && game.classList.contains("on")) {
        timeLeft -= dt;
        timerAcc += dt;
        if (timerAcc >= 0.2) {
          timerAcc = 0;
          updateHud();
        }
        if (timeLeft <= 0) {
          timeLeft = 0;
          failRun("시간 초과! 1라운드부터 다시입니다.");
        }
      }
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
