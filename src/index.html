<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네모 생성 게임</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #333;
            background-color: #888;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="controls">
            <p>🎮 <strong>네모 생성 게임</strong></p>
            <p>🔴 빨간 버튼: 무료 네모 생성 | 🔵 파란 버튼: $1 네모 생성</p>
            <p>🖱️ 마우스로 네모를 드래그할 수 있습니다!</p>
            <p>💰 오른쪽 파란 판매 구역에 네모를 넣으면 돈을 받습니다! (빨간1원, 파란1원)</p>
        </div>
    </div>
</body>
</html>
<script>
    class SimpleGame {
        constructor() {
            this.canvas = document.getElementById('gameCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.gameRunning = true;
            this.money = 10;
            
            // 게임 요소들
            this.ground = { y: 350, height: 50 };
            this.tunnel = { x: 10, y: 50, width: 40, height: 150 };
            this.smallSquares = [];
            this.redButton = { x: 100, y: 50, width: 60, height: 30, price: 0 };
            this.blueButton = { x: 170, y: 50, width: 60, height: 30, price: 1 };
            this.sellZone = { x: 500, y: 325, width: 80, height: 25 };
            
            // 물리
            this.gravity = 0.1;
            
            // 마우스 드래그
            this.draggedSquare = null;
            this.mouseX = 0;
            this.mouseY = 0;
            this.isDragging = false;
            
            // 새로운 블럭 메시지
            this.newBlockMessageFrames = 0;
            this.discoveredColors = new Set();
            
            
            // 파티클 시스템
            this.fireParticles = [];
            this.waterDrops = [];
            this.lightningParticles = [];
            this.superLightningParticles = [];
            this.smokeCircles = [];
            this.fogCircles = [];
            this.rainDrops = [];
            this.hailStones = [];
            this.snowFlakes = [];
            
            // 열매 시스템
            this.fruits = [];
            
            // 상점 시스템
            this.currentScreen = 'lab'; // 'lab', 'shop', 'dev', 'chest'
            this.shopButton = { x: 500, y: 10, width: 80, height: 30 };
            this.devButton = { x: 500, y: 50, width: 80, height: 30 };
            this.exitShopButton = { x: 500, y: 10, width: 80, height: 30 };
            this.exitDevButton = { x: 500, y: 10, width: 80, height: 30 };
            this.exitChestButton = { x: 500, y: 10, width: 80, height: 30 };
            this.shopItems = [];
            this.devItems = [];
            this.shopScrollY = 0;
            this.devScrollY = 0;
            this.chestScrollY = 0;
            this.currentChest = null;
            
            // 더블클릭 감지
            this.lastClickTime = 0;
            this.lastClickSquare = null;
            
            // 개발자 도구 개수 입력
            this.devQuantity = 1;
            this.devQuantityInput = { x: 20, y: 100, width: 60, height: 25 };
            this.devBuyButton = { x: 90, y: 100, width: 60, height: 25 };
            this.devInputFocused = false;
            
            this.setupEventListeners();
            this.gameLoop();
        }
        
        setupEventListeners() {
            this.canvas.addEventListener('mousedown', (e) => {
                const rect = this.canvas.getBoundingClientRect();
                this.mouseX = e.clientX - rect.left;
                this.mouseY = e.clientY - rect.top;
                
                if (this.currentScreen === 'lab') {
                    // 빨간 버튼 클릭
                    if (this.mouseX >= this.redButton.x && this.mouseX <= this.redButton.x + this.redButton.width &&
                        this.mouseY >= this.redButton.y && this.mouseY <= this.redButton.y + this.redButton.height) {
                        this.spawnSmallSquare('red');
                        return;
                    }
                    
                    // 파란 버튼 클릭
                    if (this.mouseX >= this.blueButton.x && this.mouseX <= this.blueButton.x + this.blueButton.width &&
                        this.mouseY >= this.blueButton.y && this.mouseY <= this.blueButton.y + this.blueButton.height) {
                        if (this.money >= this.blueButton.price) {
                            this.spawnSmallSquare('blue');
                        }
                        return;
                    }
                    
                    // 상점 버튼 클릭
                    if (this.mouseX >= this.shopButton.x && this.mouseX <= this.shopButton.x + this.shopButton.width &&
                        this.mouseY >= this.shopButton.y && this.mouseY <= this.shopButton.y + this.shopButton.height) {
                        this.currentScreen = 'shop';
                        this.updateShopItems();
                        return;
                    }
                    
                    // 개발자 도구 버튼 클릭
                    if (this.mouseX >= this.devButton.x && this.mouseX <= this.devButton.x + this.devButton.width &&
                        this.mouseY >= this.devButton.y && this.mouseY <= this.devButton.y + this.devButton.height) {
                        this.currentScreen = 'dev';
                        this.updateDevItems();
                        return;
                    }
                    
                    // 더블클릭 감지 (상자 열기)
                    const currentTime = Date.now();
                    for (let i = this.smallSquares.length - 1; i >= 0; i--) {
                        const square = this.smallSquares[i];
                        const bounds = square.isPlant ? this.getPlantBounds(square) : square;
                        
                        if (this.mouseX >= bounds.x && this.mouseX <= bounds.x + bounds.width &&
                            this.mouseY >= bounds.y && this.mouseY <= bounds.y + bounds.height) {
                            
                            // 더블클릭 체크
                            if (square === this.lastClickSquare && currentTime - this.lastClickTime < 300) {
                                // 상자 더블클릭
                                if (square.isChest) {
                                    console.log('상자 더블클릭! 저장된 블럭 수:', square.storedBlocks ? square.storedBlocks.length : 0);
                                    this.currentChest = square;
                                    this.currentScreen = 'chest';
                                    this.chestScrollY = 0;
                                    this.lastClickTime = 0;
                                    this.lastClickSquare = null;
                                    return;
                                }
                                // 자석장자 클릭 (블럭 꺼내기)
                                else if (square.isMagnetChest && square.storedBlocks && square.storedBlocks.length > 0) {
                                    const storedBlock = square.storedBlocks[0];
                                    console.log('자석장자에서 블럭 꺼내기:', storedBlock.color);
                                    
                                    const newBlock = {
                                        x: square.x + 50, // 자석장자 오른쪽으로 50픽셀 이동
                                        y: square.y - 50, // 자석장자 위로 50픽셀 이동
                                        width: 20,
                                        height: 20,
                                        color: storedBlock.color,
                                        velocityX: 0,
                                        velocityY: 0,
                                        isOnGround: false,
                                        isSpecial: storedBlock.isSpecial,
                                        isFire: storedBlock.isFire,
                                        isWater: storedBlock.isWater,
                                        isSoil: storedBlock.isSoil,
                                        isPlant: storedBlock.isPlant,
                                        isElectric: storedBlock.isElectric,
                                        isSuperElectric: storedBlock.isSuperElectric,
                                        isLight: storedBlock.isLight,
                                        isIce: storedBlock.isIce,
                                        isSpace: storedBlock.isSpace,
                                        isVoid: storedBlock.isVoid,
                                        isMagnet: storedBlock.isMagnet,
                                        isVirus: storedBlock.isVirus,
                                        isChest: storedBlock.isChest,
                                        isMagnetChest: storedBlock.isMagnetChest,
                                        isMovingVoid: storedBlock.isMovingVoid,
                                        isSmoke: storedBlock.isSmoke,
                                        isFog: storedBlock.isFog,
                                        isCloud: storedBlock.isCloud,
                                        isRainCloud: storedBlock.isRainCloud,
                                        isHailCloud: storedBlock.isHailCloud,
                                        isSnowCloud: storedBlock.isSnowCloud,
                                        isSnow: storedBlock.isSnow,
                                        hailTimer: storedBlock.hailTimer,
                                        snowTimer: storedBlock.snowTimer,
                                        isFruit: storedBlock.isFruit,
                                        plantGrowth: storedBlock.plantGrowth,
                                        fruitTimer: storedBlock.fruitTimer,
                                        icePrice: storedBlock.icePrice,
                                        iceTimer: storedBlock.iceTimer,
                                        iceShrinkTimer: storedBlock.iceShrinkTimer,
                                        fruitValue: storedBlock.fruitValue,
                                        boostLevel: storedBlock.boostLevel || 0,
                                        lastBoostTime: storedBlock.lastBoostTime || Date.now(),
                                        lastParticleTime: 0 // 파티클 생성 타이머 초기화
                                    };
                                    
                                    // 새로 나온 블럭에 일시적 보호 마크 추가
                                    newBlock.isNewlySpawned = true;
                                    newBlock.spawnTime = Date.now();
                                    
                                    this.smallSquares.push(newBlock);
                                    
                                    // 파티클 효과가 활성화된 블럭을 꺼낼 때 노란 동그라미 파티클 생성
                                    if (storedBlock.boostLevel >= 1) {
                                        const centerX = square.x + square.width / 2;
                                        const centerY = square.y + square.height / 2;
                                        
                                        // 노란 동그라미 파티클 15개 생성
                                        for (let i = 0; i < 15; i++) {
                                            const angle = (i / 15) * Math.PI * 2;
                                            const speed = 2 + Math.random() * 3;
                                            const size = 2 + Math.random() * 3;
                                            
                                            this.fireParticles.push({
                                                x: centerX,
                                                y: centerY,
                                                velocityX: Math.cos(angle) * speed,
                                                velocityY: Math.sin(angle) * speed,
                                                size: size,
                                                color: '#ffff00', // 노란색
                                                life: 30 + Math.random() * 20, // 30-50 프레임
                                                maxLife: 30 + Math.random() * 20
                                            });
                                        }
                                    }
                                    
                                    square.storedBlocks = []; // 자석장자 비우기
                                    
                                    this.lastClickTime = 0;
                                    this.lastClickSquare = null;
                                    return;
                                }
                            }
                            
                            this.lastClickTime = currentTime;
                            this.lastClickSquare = square;
                            
                            this.draggedSquare = square;
                            this.isDragging = true;
                            break;
                        }
                    }
                } else if (this.currentScreen === 'shop') {
                    // 상점 나가기 버튼 클릭
                    if (this.mouseX >= this.exitShopButton.x && this.mouseX <= this.exitShopButton.x + this.exitShopButton.width &&
                        this.mouseY >= this.exitShopButton.y && this.mouseY <= this.exitShopButton.y + this.exitShopButton.height) {
                        this.currentScreen = 'lab';
                        return;
                    }
                    
                    // 상점 아이템 클릭
                    let y = 100 + this.shopScrollY;
                    this.shopItems.forEach((item, index) => {
                        if (this.mouseY > y - 20 && this.mouseY < y + 20 && this.mouseX > 60 && this.mouseX < this.canvas.width - 60) {
                            this.buyShopItem(item);
                        }
                        y += 50;
                    });
                } else if (this.currentScreen === 'dev') {
                    // 개발자 도구 입력창 클릭
                    if (this.mouseX >= this.devQuantityInput.x && this.mouseX <= this.devQuantityInput.x + this.devQuantityInput.width &&
                        this.mouseY >= this.devQuantityInput.y && this.mouseY <= this.devQuantityInput.y + this.devQuantityInput.height) {
                        this.devInputFocused = true;
                        return;
                    }
                    
                    // 개발자 도구 구매 버튼 클릭
                    if (this.mouseX >= this.devBuyButton.x && this.mouseX <= this.devBuyButton.x + this.devBuyButton.width &&
                        this.mouseY >= this.devBuyButton.y && this.mouseY <= this.devBuyButton.y + this.devBuyButton.height) {
                        if (this.selectedDevItem) {
                            const quantity = this.devQuantity > 0 ? this.devQuantity : 1;
                            console.log('개발자 도구 구매:', this.selectedDevItem.name, 'x' + quantity);
                            for (let i = 0; i < quantity; i++) {
                                this.spawnDevItem(this.selectedDevItem);
                            }
                        }
                        return;
                    }
                    
                    // 개발자 도구 아이템 클릭 (선택) - 정확한 위치로 수정
                    let itemClicked = false;
                    if (this.devItems && this.devItems.length > 0) {
                        let y = 170 + this.devScrollY;
                        for (let i = 0; i < this.devItems.length; i++) {
                            const item = this.devItems[i];
                            // 렌더링과 정확히 같은 위치에서 클릭 감지 (약간의 여유 공간 추가)
                            if (this.mouseY >= y - 25 && this.mouseY <= y + 25 && 
                                this.mouseX >= 50 && this.mouseX <= this.canvas.width - 50) {
                                this.selectedDevItem = item;
                                itemClicked = true;
                                console.log('개발자 도구 아이템 선택:', item.name, 'index:', i, 'y:', y, 'mouseY:', this.mouseY);
                                break;
                            }
                            y += 50;
                        }
                    }
                    
                    if (!itemClicked) {
                        this.devInputFocused = false;
                    }
                    
                    // 개발자 도구 나가기 버튼 클릭 (마지막에 처리)
                    if (this.mouseX >= this.exitDevButton.x && this.mouseX <= this.exitDevButton.x + this.exitDevButton.width &&
                        this.mouseY >= this.exitDevButton.y && this.mouseY <= this.exitDevButton.y + this.exitDevButton.height) {
                        this.currentScreen = 'lab';
                        return;
                    }
                } else if (this.currentScreen === 'chest') {
                    // 상자 나가기 버튼 클릭
                    if (this.mouseX >= this.exitChestButton.x && this.mouseX <= this.exitChestButton.x + this.exitChestButton.width &&
                        this.mouseY >= this.exitChestButton.y && this.mouseY <= this.exitChestButton.y + this.exitChestButton.height) {
                        this.currentScreen = 'lab';
                        this.currentChest = null;
                        return;
                    }
                    
                    // 상자 아이템 클릭 (블럭 꺼내기) - for 루프로 수정
                    if (this.currentChest && this.currentChest.storedBlocks) {
                        let y = 170 + this.chestScrollY;
                        for (let index = 0; index < this.currentChest.storedBlocks.length; index++) {
                            const storedBlock = this.currentChest.storedBlocks[index];
                            console.log('상자 아이템 체크:', index, 'y:', y, 'mouseY:', this.mouseY, 'mouseX:', this.mouseX);
                            if (this.mouseY > y - 20 && this.mouseY < y + 20 && this.mouseX > 60 && this.mouseX < this.canvas.width - 60) {
                                // 블럭을 상자 위로 꺼내기
                                console.log('상자에서 블럭 꺼내기:', storedBlock.color, 'index:', index, '남은 블럭 수:', this.currentChest.storedBlocks.length - 1);
                                const newBlock = {
                                    x: this.currentChest.x + 50, // 상자 오른쪽으로 50픽셀 이동
                                    y: this.currentChest.y - 50, // 상자 위로 50픽셀 이동
                                    width: 20,
                                    height: 20,
                                    color: storedBlock.color,
                                    velocityX: 0,
                                    velocityY: 0,
                                    isOnGround: false,
                                    isSpecial: storedBlock.isSpecial,
                                    isFire: storedBlock.isFire,
                                    isWater: storedBlock.isWater,
                                    isSoil: storedBlock.isSoil,
                                    isPlant: storedBlock.isPlant,
                                    isElectric: storedBlock.isElectric,
                                    isSuperElectric: storedBlock.isSuperElectric,
                                    isLight: storedBlock.isLight,
                                    isIce: storedBlock.isIce,
                                    isSpace: storedBlock.isSpace,
                                    isVoid: storedBlock.isVoid,
                                    isMagnet: storedBlock.isMagnet,
                                    isVirus: storedBlock.isVirus,
                                    isChest: storedBlock.isChest,
                                    isMagnetChest: storedBlock.isMagnetChest,
                                    isMovingVoid: storedBlock.isMovingVoid,
                                    isSmoke: storedBlock.isSmoke,
                                    isFog: storedBlock.isFog,
                                    isCloud: storedBlock.isCloud,
                                    isRainCloud: storedBlock.isRainCloud,
                                    isHailCloud: storedBlock.isHailCloud,
                                    isSnowCloud: storedBlock.isSnowCloud,
                                    isSnow: storedBlock.isSnow,
                                    hailTimer: storedBlock.hailTimer,
                                    snowTimer: storedBlock.snowTimer,
                                    isFruit: storedBlock.isFruit,
                                    plantGrowth: storedBlock.plantGrowth,
                                    fruitTimer: storedBlock.fruitTimer,
                                    icePrice: storedBlock.icePrice,
                                    iceTimer: storedBlock.iceTimer,
                                    iceShrinkTimer: storedBlock.iceShrinkTimer,
                                    fruitValue: storedBlock.fruitValue
                                };
                                
                                // 새로 나온 블럭에 일시적 보호 마크 추가
                                newBlock.isNewlySpawned = true;
                                newBlock.spawnTime = Date.now();
                                
                                this.smallSquares.push(newBlock);
                                this.currentChest.storedBlocks.splice(index, 1);
                                return; // 클릭 이벤트 처리 완료
                            }
                            y += 50;
                        }
                    }
                    
                }
            });
            
            this.canvas.addEventListener('mousemove', (e) => {
                const rect = this.canvas.getBoundingClientRect();
                this.mouseX = e.clientX - rect.left;
                this.mouseY = e.clientY - rect.top;
                
                if (this.isDragging && this.draggedSquare) {
                    this.draggedSquare.x = this.mouseX - this.draggedSquare.width / 2;
                    this.draggedSquare.y = this.mouseY - this.draggedSquare.height / 2;
                    this.draggedSquare.velocityX = 0;
                    this.draggedSquare.velocityY = 0;
                }
            });
            
            this.canvas.addEventListener('mouseup', () => {
                this.isDragging = false;
                this.draggedSquare = null;
            });
            
            this.canvas.addEventListener('mouseleave', () => {
                this.isDragging = false;
                this.draggedSquare = null;
            });
            
            this.canvas.addEventListener('wheel', (e) => {
                if (this.currentScreen === 'shop') {
                    e.preventDefault();
                    this.shopScrollY += e.deltaY;
                    if (this.shopScrollY > 0) this.shopScrollY = 0;
                    const maxScroll = Math.max(0, this.shopItems.length * 50 - 200);
                    if (this.shopScrollY < -maxScroll) this.shopScrollY = -maxScroll;
                }             else if (this.currentScreen === 'dev') {
                e.preventDefault();
                this.devScrollY += e.deltaY;
                if (this.devScrollY > 0) this.devScrollY = 0;
                const maxScroll = Math.max(0, this.devItems.length * 50 - 150);
                if (this.devScrollY < -maxScroll) this.devScrollY = -maxScroll;
            }
            else if (this.currentScreen === 'chest') {
                e.preventDefault();
                this.chestScrollY += e.deltaY;
                if (this.chestScrollY > 0) this.chestScrollY = 0;
                const maxScroll = Math.max(0, (this.currentChest ? this.currentChest.storedBlocks.length : 0) * 50 - 150);
                if (this.chestScrollY < -maxScroll) this.chestScrollY = -maxScroll;
            }
            });
            
            // 키보드 입력 이벤트
            document.addEventListener('keydown', (e) => {
                if (this.currentScreen === 'dev' && this.devInputFocused) {
                    // 숫자 키 입력
                    if (e.key >= '0' && e.key <= '9') {
                        if (this.devQuantity === 0) {
                            this.devQuantity = parseInt(e.key);
                        } else {
                            this.devQuantity = this.devQuantity * 10 + parseInt(e.key);
                        }
                        // 최대 999로 제한
                        if (this.devQuantity > 999) {
                            this.devQuantity = 999;
                        }
                    }
                    // 백스페이스로 숫자 삭제
                    else if (e.key === 'Backspace') {
                        this.devQuantity = Math.floor(this.devQuantity / 10);
                        // 0이 되면 빈 상태로 유지 (1로 되돌리지 않음)
                        if (this.devQuantity === 0) {
                            this.devQuantity = 0;
                        }
                    }
                    // Enter로 구매 (개수 체크 제거)
                    else if (e.key === 'Enter') {
                        if (this.selectedDevItem) {
                            const quantity = this.devQuantity > 0 ? this.devQuantity : 1;
                            for (let i = 0; i < quantity; i++) {
                                this.spawnDevItem(this.selectedDevItem);
                            }
                        }
                        this.devInputFocused = false;
                    }
                    // Escape로 포커스 해제
                    else if (e.key === 'Escape') {
                        this.devInputFocused = false;
                    }
                }
            });
        }
        
        update() {
            this.updateSmallSquares();
            this.updateFireParticles();
            this.updateWaterDrops();
            this.updateLightningParticles();
            this.updateSuperLightningParticles();
            this.updateSmokeCircles();
            this.updateFogCircles();
            this.updateRainDrops();
            this.updateHailStones();
            this.updateSnowFlakes();
            this.checkHailCollisions();
            this.checkSnowCollisions();
            this.updateFruits();
            
            // 새로운 블럭 메시지 업데이트
            if (this.newBlockMessageFrames > 0) {
                this.newBlockMessageFrames--;
            }
            
        }
        
        isSpaceBlockInSpecialArea(square) {
            // 상점 버튼 영역 (500, 10, 80, 30)
            if (square.x < this.shopButton.x + this.shopButton.width &&
                square.x + square.width > this.shopButton.x &&
                square.y < this.shopButton.y + this.shopButton.height &&
                square.y + square.height > this.shopButton.y) {
                return true;
            }
            
            // 빨간 버튼 영역 (100, 50, 60, 30)
            if (square.x < this.redButton.x + this.redButton.width &&
                square.x + square.width > this.redButton.x &&
                square.y < this.redButton.y + this.redButton.height &&
                square.y + square.height > this.redButton.y) {
                return true;
            }
            
            // 파란 버튼 영역 (170, 50, 60, 30)
            if (square.x < this.blueButton.x + this.blueButton.width &&
                square.x + square.width > this.blueButton.x &&
                square.y < this.blueButton.y + this.blueButton.height &&
                square.y + square.height > this.blueButton.y) {
                return true;
            }
            
            // 판매 구역 (500, 325, 80, 25)
            if (square.x < this.sellZone.x + this.sellZone.width &&
                square.x + square.width > this.sellZone.x &&
                square.y < this.sellZone.y + this.sellZone.height &&
                square.y + square.height > this.sellZone.y) {
                return true;
            }
            
            // 터널 영역 (10, 50, 40, 150)
            if (square.x < this.tunnel.x + this.tunnel.width &&
                square.x + square.width > this.tunnel.x &&
                square.y < this.tunnel.y + this.tunnel.height &&
                square.y + square.height > this.tunnel.y) {
                return true;
            }
            
            return false;
        }
        
        updateSmallSquares() {
            this.smallSquares.forEach((square, index) => {
                // 얼음 블럭 특별 처리 (드래그 중에도 적용)
                if (square.isIce) {
                    square.iceTimer++;
                    square.iceShrinkTimer++;
                    
                    // 10초(600프레임)마다 크기 감소 및 가격 감소
                    if (square.iceShrinkTimer >= 600) {
                        square.iceShrinkTimer = 0;
                        square.icePrice--;
                        square.width = Math.max(12, square.width - 2);
                        square.height = Math.max(12, square.height - 2);
                        
                        // 가격이 10원이 되면 물 블럭으로 변환
                        if (square.icePrice <= 10) {
                            square.isIce = false;
                            square.isWater = true;
                            square.icePrice = undefined;
                            square.iceTimer = undefined;
                            square.iceShrinkTimer = undefined;
                        }
                    }
                }
                
                if (square !== this.draggedSquare) {
                    // 중력 적용 (우주 블럭, 구름 블럭, 전진 블럭들은 특정 영역에서만 중력 없음)
                    if ((!square.isSpace && !square.isCloud && !square.isRainCloud && !square.isHailCloud && !square.isSnowCloud && !square.isAdvance) || 
                        (square.isSpace && this.isSpaceBlockInSpecialArea(square)) ||
                        (square.isCloud && this.isSpaceBlockInSpecialArea(square)) ||
                        (square.isRainCloud && this.isSpaceBlockInSpecialArea(square)) ||
                        (square.isHailCloud && this.isSpaceBlockInSpecialArea(square)) ||
                        (square.isSnowCloud && this.isSpaceBlockInSpecialArea(square))) {
                    square.velocityY += this.gravity;
                    square.y += square.velocityY;
                    }
                    
                    // 전진 블럭 위치 업데이트 (중력 없이 자유롭게 움직임)
                    if (square.isAdvance) {
                        square.x += square.velocityX;
                        square.y += square.velocityY;
                    }
                    
                    // 바닥 충돌 (우주 블럭, 구름 블럭, 전진 블럭들은 특정 영역에서만 바닥 충돌 없음)
                    if ((!square.isSpace && !square.isCloud && !square.isRainCloud && !square.isHailCloud && !square.isSnowCloud && !square.isAdvance) || 
                        (square.isSpace && this.isSpaceBlockInSpecialArea(square)) ||
                        (square.isCloud && this.isSpaceBlockInSpecialArea(square)) ||
                        (square.isRainCloud && this.isSpaceBlockInSpecialArea(square)) ||
                        (square.isHailCloud && this.isSpaceBlockInSpecialArea(square)) ||
                        (square.isSnowCloud && this.isSpaceBlockInSpecialArea(square))) {
                    if (square.y + square.height >= this.ground.y) {
                        square.y = this.ground.y - square.height;
                        square.velocityY = 0;
                        square.isOnGround = true;
                    } else {
                            square.isOnGround = false;
                        }
                    } else {
                        // 우주 블럭은 특별 영역 밖에서만 공중에 있음
                        square.isOnGround = false;
                    }
                    
                    // 마찰 적용
                    if ((square.isSpace || square.isCloud || square.isRainCloud || square.isHailCloud || square.isSnowCloud || square.isAdvance) && !this.isSpaceBlockInSpecialArea(square)) {
                        // 우주 블럭, 구름 블럭, 전진 블럭들은 특별 영역 밖에서만 마찰 없음 (무중력)
                        // velocityX는 그대로 유지
                    } else if (square.isIce) {
                        // 얼음 블럭은 진짜 얼음처럼 미끄러움
                    if (square.isOnGround) {
                            // 바닥에서는 속도에 따라 마찰이 달라짐 (빠를수록 미끄러움)
                            const speed = Math.abs(square.velocityX);
                            if (speed > 2) {
                                // 매우 빠를 때: 거의 마찰 없음 (0.995)
                                square.velocityX *= 0.995;
                            } else if (speed > 1) {
                                // 빠를 때: 약간의 마찰 (0.99)
                                square.velocityX *= 0.99;
                            } else if (speed > 0.5) {
                                // 보통일 때: 조금 더 마찰 (0.98)
                                square.velocityX *= 0.98;
                            } else {
                                // 느릴 때: 더 많은 마찰 (0.95)
                                square.velocityX *= 0.95;
                            }
                        } else {
                            // 공중에서는 거의 마찰 없음
                            square.velocityX *= 0.999;
                        }
                        if (Math.abs(square.velocityX) < 0.02) {
                            square.velocityX = 0;
                        }
                    } else if (square.isOnGround) {
                        // 일반 블럭은 바닥에서만 마찰
                        square.velocityX *= 0.8;
                        if (Math.abs(square.velocityX) < 0.1) {
                            square.velocityX = 0;
                        }
                    }
                    
                    // 화면 경계
                    if (square.x < 0) {
                        square.x = 0;
                        square.velocityX = 0;
                    }
                    if (square.x + square.width > this.canvas.width) {
                        square.x = this.canvas.width - square.width;
                        square.velocityX = 0;
                    }
                    
                    // 화면 아래로 떨어지면 제거
                    if (square.y > this.canvas.height) {
                        this.smallSquares.splice(index, 1);
                    }
                }
            });
            
            this.checkSquareSquareCollisions();
            this.checkSoilEating();
            this.checkMagnetEffect();
            this.checkVoidAbsorption();
            this.checkVirusInfection();
            this.checkChestStorage();
            this.checkMovingVoidEffect();
            this.checkMagnetChestBoost();
            this.checkBoostedBlockParticles();
            this.checkAdvanceBlockMovement();
            this.checkSellZoneCollisions();
            this.updatePlantFruits();
        }
        
        getPlantBounds(square) {
            // 식물의 실제 경계를 계산 (성장한 높이 포함)
            const growth = square.plantGrowth || 1;
            const growthHeight = 20 + (growth - 1) * 1;
            const plantY = square.y + (20 - growthHeight);
            
            return {
                x: square.x,
                y: plantY,
                width: 20,
                height: growthHeight
            };
        }
        
        updatePlantFruits() {
            // 식물의 열매 생성 로직
            this.smallSquares.forEach(square => {
                if (square.isPlant && square.plantGrowth >= 5) {
                    square.fruitTimer++;
                    const fruitLevel = square.fruitLevel || 0;
                    const fruitInterval = 600; // 10초마다
                    
                    if (square.fruitTimer >= fruitInterval) {
                        square.fruitTimer = 0;
                        
                        // 열매 생성 (식물 위쪽에) - 작은 열매가 갑자기 나타남
                        const maxFruitSize = 8 + fruitLevel * 2; // 열매 레벨에 따라 최대 크기 증가 (더 크게)
                        const fruitValue = 5 + fruitLevel * 5; // 열매 레벨에 따라 가치 증가
                        
                        this.fruits.push({
                            x: square.x + square.width / 2 - 2, // 작은 열매로 시작
                            y: square.y - 2 - 5, // 식물 위쪽에
                            width: 4, // 처음에는 4픽셀로 시작 (더 크게)
                            height: 4,
                            color: '#fff8dc', // 바나나 우유색 (진짜 연한 노랑색)
                            life: 300, // 5초간 유지
                            value: fruitValue,
                            growthTimer: 0,
                            maxSize: maxFruitSize,
                            isGrowing: true, // 성장 중인지 표시
                            fallTimer: 0 // 떨어지기 전 대기 시간
                        });
                    }
                }
            });
        }
        
        checkMagnetEffect() {
            this.smallSquares.forEach((magnetSquare, magnetIndex) => {
                if (magnetSquare.isMagnet) {
                    this.smallSquares.forEach((otherSquare, otherIndex) => {
                        if (otherIndex !== magnetIndex && otherSquare !== this.draggedSquare) {
                            // 식물의 경우 실제 크기 사용
                            const otherBounds = otherSquare.isPlant ? this.getPlantBounds(otherSquare) : otherSquare;
                            
                            // 거리 계산
                            const dx = otherBounds.x + otherBounds.width/2 - (magnetSquare.x + magnetSquare.width/2);
                            const dy = otherBounds.y + otherBounds.height/2 - (magnetSquare.y + magnetSquare.height/2);
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            // 자력 범위 (80픽셀)
                            if (distance < 80 && distance > 0) {
                                // 자력 강도 (거리가 가까울수록 강함)
                                const magnetStrength = (80 - distance) / 80 * 0.3;
                                
                                // 자력 적용 (자석 블럭에서 멀어지는 방향으로)
                                otherSquare.velocityX += (dx / distance) * magnetStrength;
                                otherSquare.velocityY += (dy / distance) * magnetStrength;
                                
                                // 속도 제한
                                const maxSpeed = 2;
                                const speed = Math.sqrt(otherSquare.velocityX * otherSquare.velocityX + otherSquare.velocityY * otherSquare.velocityY);
                                if (speed > maxSpeed) {
                                    otherSquare.velocityX = (otherSquare.velocityX / speed) * maxSpeed;
                                    otherSquare.velocityY = (otherSquare.velocityY / speed) * maxSpeed;
                                }
                            }
                        }
                    });
                }
            });
        }
        
        checkVoidAbsorption() {
            this.smallSquares.forEach((voidSquare, voidIndex) => {
                if (voidSquare.isVoid) {
                    // 뒤에서부터 순회하여 인덱스 문제 방지
                    for (let i = this.smallSquares.length - 1; i >= 0; i--) {
                        const otherSquare = this.smallSquares[i];
                        if (i !== voidIndex && otherSquare !== this.draggedSquare) {
                            // 식물의 경우 실제 크기 사용
                            const otherBounds = otherSquare.isPlant ? this.getPlantBounds(otherSquare) : otherSquare;
                            
                            // 충돌 감지
                            if (voidSquare.x < otherBounds.x + otherBounds.width &&
                                voidSquare.x + voidSquare.width > otherBounds.x &&
                                voidSquare.y < otherBounds.y + otherBounds.height &&
                                voidSquare.y + voidSquare.height > otherBounds.y) {
                                
                                // 다른 블럭을 흡수 (제거)
                                this.smallSquares.splice(i, 1);
                                
                                // 인덱스 조정 (제거된 블럭이 void 블럭보다 앞에 있었으면)
                                if (i < voidIndex) {
                                    voidIndex--;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        updateFruits() {
            // 열매 업데이트
            for (let i = this.fruits.length - 1; i >= 0; i--) {
                const fruit = this.fruits[i];
                
                // 열매 생명 감소
                fruit.life--;
                if (fruit.life <= 0) {
                    this.fruits.splice(i, 1);
                    continue;
                }
                
                if (fruit.isGrowing) {
                    // 열매 성장 (점점 커짐)
                    fruit.growthTimer++;
                    if (fruit.growthTimer < 60) { // 1초간 성장
                        const growthProgress = fruit.growthTimer / 60;
                        const currentSize = 4 + (fruit.maxSize - 4) * growthProgress; // 4픽셀에서 시작
                        fruit.width = currentSize;
                        fruit.height = currentSize;
                        
                        // 중앙 정렬 유지
                        fruit.x = fruit.x + (fruit.width - fruit.width) / 2;
                    } else {
                        // 성장 완료 - 2초 대기 후 떨어짐
                        fruit.fallTimer++;
                        if (fruit.fallTimer >= 120) { // 2초 대기
                            fruit.isGrowing = false;
                            fruit.fallTimer = 0;
                        }
                    }
                } else {
                    // 열매 중력 적용 (떨어짐)
                    fruit.y += 0.5;
                    
                    // 바닥에 닿으면 일반 블럭으로 변환 (완전체 크기로)
                    if (fruit.y + fruit.height >= this.ground.y) {
                        // 일반 블럭으로 변환 (완전체 크기)
                        const block = {
                            x: fruit.x,
                            y: this.ground.y - fruit.maxSize, // 완전체 크기로
                            width: fruit.maxSize, // 완전체 크기
                            height: fruit.maxSize, // 완전체 크기
                            color: fruit.color,
                            velocityX: 0,
                            velocityY: 0,
                            isOnGround: true,
                            isFruit: true, // 열매에서 변환된 블럭 표시
                            fruitValue: fruit.value
                        };
                        
                        // 다른 블럭과 겹치지 않도록 위치 조정
                        this.adjustBlockPosition(block);
                        
                        this.smallSquares.push(block);
                        this.fruits.splice(i, 1);
                    }
                }
            }
        }
        
        adjustBlockPosition(newBlock) {
            // 다른 블럭과 겹치지 않도록 위치 조정
            let attempts = 0;
            const maxAttempts = 50;
            
            while (attempts < maxAttempts) {
                let hasCollision = false;
                
                // 기존 블럭들과 충돌 검사
                for (const existingBlock of this.smallSquares) {
                    const existingBounds = existingBlock.isPlant ? this.getPlantBounds(existingBlock) : existingBlock;
                    
                    if (newBlock.x < existingBounds.x + existingBounds.width &&
                        newBlock.x + newBlock.width > existingBounds.x &&
                        newBlock.y < existingBounds.y + existingBounds.height &&
                        newBlock.y + newBlock.height > existingBounds.y) {
                        hasCollision = true;
                        break;
                    }
                }
                
                if (!hasCollision) {
                    break; // 충돌이 없으면 위치 확정
                }
                
                // 충돌이 있으면 위치를 조금씩 이동
                newBlock.x += 5;
                if (newBlock.x + newBlock.width > this.canvas.width) {
                    newBlock.x = 0; // 화면 끝에 도달하면 처음으로
                    newBlock.y -= 5; // 위로 이동
                }
                
                attempts++;
            }
        }
        
        checkVirusInfection() {
            // 바이러스 블럭의 감염 기능
            this.smallSquares.forEach((virusSquare, virusIndex) => {
                if (virusSquare.isVirus) {
                    this.smallSquares.forEach((otherSquare, otherIndex) => {
                        if (otherIndex !== virusIndex && otherSquare !== this.draggedSquare && !otherSquare.isVirus) {
                            // 식물의 경우 실제 크기 사용
                            const otherBounds = otherSquare.isPlant ? this.getPlantBounds(otherSquare) : otherSquare;
                            
                            // 충돌 감지
                            if (virusSquare.x < otherBounds.x + otherBounds.width &&
                                virusSquare.x + virusSquare.width > otherBounds.x &&
                                virusSquare.y < otherBounds.y + otherBounds.height &&
                                virusSquare.y + virusSquare.height > otherBounds.y) {
                                
                                // 다른 블럭을 바이러스 블럭으로 변환
                                otherSquare.color = '#8b008b'; // 자멘타색
                                otherSquare.isVirus = true;
                                
                                // 기존 특수 속성 제거 (바이러스가 우선)
                                otherSquare.isSpecial = false;
                                otherSquare.isFire = false;
                                otherSquare.isWater = false;
                                otherSquare.isSoil = false;
                                otherSquare.isPlant = false;
                                otherSquare.isElectric = false;
                                otherSquare.isSuperElectric = false;
                                otherSquare.isLight = false;
                                otherSquare.isIce = false;
                                otherSquare.isSpace = false;
                                otherSquare.isVoid = false;
                                otherSquare.isMagnet = false;
                                otherSquare.isFruit = false;
                            }
                        }
                    });
                }
            });
        }
        
        checkChestStorage() {
            // 새로 나온 블럭의 보호 마크 제거 (2초 후)
            this.smallSquares.forEach(square => {
                if (square.isNewlySpawned && Date.now() - square.spawnTime > 2000) {
                    square.isNewlySpawned = false;
                    delete square.spawnTime;
                }
            });
            
            // 상자 블럭의 저장 기능
            this.smallSquares.forEach((chestSquare, chestIndex) => {
                if (chestSquare.isChest) {
                    this.smallSquares.forEach((otherSquare, otherIndex) => {
                        if (otherIndex !== chestIndex && otherSquare !== this.draggedSquare && !otherSquare.isChest && !otherSquare.isMagnetChest && !otherSquare.isMagnet && !otherSquare.isNewlySpawned) {
                            // 식물의 경우 실제 크기 사용
                            const otherBounds = otherSquare.isPlant ? this.getPlantBounds(otherSquare) : otherSquare;
                            
                            // 충돌 감지 (정확한 범위로 설정)
                            if (chestSquare.x - 5 < otherBounds.x + otherBounds.width &&
                                chestSquare.x + chestSquare.width + 5 > otherBounds.x &&
                                chestSquare.y - 5 < otherBounds.y + otherBounds.height &&
                                chestSquare.y + chestSquare.height + 5 > otherBounds.y) {
                                
                                // 다른 블럭을 상자에 저장
                                const storedBlock = {
                                    color: otherSquare.color,
                                    isSpecial: otherSquare.isSpecial || false,
                                    isFire: otherSquare.isFire || false,
                                    isWater: otherSquare.isWater || false,
                                    isSoil: otherSquare.isSoil || false,
                                    isPlant: otherSquare.isPlant || false,
                                    isElectric: otherSquare.isElectric || false,
                                    isSuperElectric: otherSquare.isSuperElectric || false,
                                    isLight: otherSquare.isLight || false,
                                    isIce: otherSquare.isIce || false,
                                    isSpace: otherSquare.isSpace || false,
                                    isVoid: otherSquare.isVoid || false,
                                    isMagnet: otherSquare.isMagnet || false,
                                    isVirus: otherSquare.isVirus || false,
                                    isChest: otherSquare.isChest || false,
                                    isMagnetChest: otherSquare.isMagnetChest || false,
                                    isMovingVoid: otherSquare.isMovingVoid || false,
                                    isSmoke: otherSquare.isSmoke || false,
                                    isFog: otherSquare.isFog || false,
                                    isCloud: otherSquare.isCloud || false,
                                    isRainCloud: otherSquare.isRainCloud || false,
                                    isHailCloud: otherSquare.isHailCloud || false,
                                    isSnowCloud: otherSquare.isSnowCloud || false,
                                    isSnow: otherSquare.isSnow || false,
                                    hailTimer: otherSquare.hailTimer || 0,
                                    snowTimer: otherSquare.snowTimer || 0,
                                    isFruit: otherSquare.isFruit || false,
                                    plantGrowth: otherSquare.plantGrowth || 1,
                                    fruitTimer: otherSquare.fruitTimer || 0,
                                    icePrice: otherSquare.icePrice || 15,
                                    iceTimer: otherSquare.iceTimer || 0,
                                    iceShrinkTimer: otherSquare.iceShrinkTimer || 0,
                                    fruitValue: otherSquare.fruitValue || 5
                                };
                                
                                chestSquare.storedBlocks.push(storedBlock);
                                console.log('상자에 블럭 저장:', otherSquare.color, '저장된 개수:', chestSquare.storedBlocks.length);
                                
                                // 원본 블럭을 제거 (상자에 저장되었으므로)
                                this.smallSquares.splice(otherIndex, 1);
                                
                                // 인덱스 조정 (제거된 블럭이 상자 블럭보다 앞에 있었으면)
                                if (otherIndex < chestIndex) {
                                    chestIndex--;
                                }
                            }
                        }
                    });
                }
            });
            
            // 자석장자 블럭의 저장 기능 (1개만 저장 가능)
            this.smallSquares.forEach((magnetChestSquare, magnetChestIndex) => {
                if (magnetChestSquare.isMagnetChest && magnetChestSquare.storedBlocks.length === 0) {
                    this.smallSquares.forEach((otherSquare, otherIndex) => {
                        if (otherIndex !== magnetChestIndex && otherSquare !== this.draggedSquare && !otherSquare.isChest && !otherSquare.isMagnetChest && !otherSquare.isMagnet && !otherSquare.isNewlySpawned && (otherSquare.boostLevel || 0) < 1) {
                            // 식물의 경우 실제 크기 사용
                            const otherBounds = otherSquare.isPlant ? this.getPlantBounds(otherSquare) : otherSquare;
                            
                            // 충돌 감지 (자석장자는 더 큰 범위로 설정)
                            if (magnetChestSquare.x - 10 < otherBounds.x + otherBounds.width &&
                                magnetChestSquare.x + magnetChestSquare.width + 10 > otherBounds.x &&
                                magnetChestSquare.y - 10 < otherBounds.y + otherBounds.height &&
                                magnetChestSquare.y + magnetChestSquare.height + 10 > otherBounds.y) {
                                
                                // 다른 블럭을 자석장자에 저장 (1개만)
                                const storedBlock = {
                                    color: otherSquare.color,
                                    isSpecial: otherSquare.isSpecial || false,
                                    isFire: otherSquare.isFire || false,
                                    isWater: otherSquare.isWater || false,
                                    isSoil: otherSquare.isSoil || false,
                                    isPlant: otherSquare.isPlant || false,
                                    isElectric: otherSquare.isElectric || false,
                                    isSuperElectric: otherSquare.isSuperElectric || false,
                                    isLight: otherSquare.isLight || false,
                                    isIce: otherSquare.isIce || false,
                                    isSpace: otherSquare.isSpace || false,
                                    isVoid: otherSquare.isVoid || false,
                                    isMagnet: otherSquare.isMagnet || false,
                                    isVirus: otherSquare.isVirus || false,

        checkMovingVoidEffect() {
            // 움직이는 공허 블럭의 끌림 및 흡수 기능
            this.smallSquares.forEach((movingVoidSquare, movingVoidIndex) => {
                if (movingVoidSquare.isMovingVoid) {
                    let nearestBlock = null;
                    let nearestDistance = Infinity;
                    
                    // 가장 가까운 블럭 찾기
                    this.smallSquares.forEach((otherSquare, otherIndex) => {
                        if (otherIndex !== movingVoidIndex && otherSquare !== this.draggedSquare && !otherSquare.isMovingVoid) {
                            // 식물의 경우 실제 크기 사용
                            const otherBounds = otherSquare.isPlant ? this.getPlantBounds(otherSquare) : otherSquare;
                            
                            // 거리 계산
                            const dx = otherBounds.x + otherBounds.width/2 - (movingVoidSquare.x + movingVoidSquare.width/2);
                            const dy = otherBounds.y + otherBounds.height/2 - (movingVoidSquare.y + movingVoidSquare.height/2);
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < nearestDistance) {
                                nearestDistance = distance;
                                nearestBlock = otherSquare;
                            }
                        }
                    });
                    
                    // 가장 가까운 블럭이 있으면 끌려가기 (더 강력하게)
                    if (nearestBlock && nearestDistance < 300) { // 300픽셀 반경 내로 확대
                        const otherBounds = nearestBlock.isPlant ? this.getPlantBounds(nearestBlock) : nearestBlock;
                        
                        // 끌림 방향 계산
                        const dx = otherBounds.x + otherBounds.width/2 - (movingVoidSquare.x + movingVoidSquare.width/2);
                        const dy = otherBounds.y + otherBounds.height/2 - (movingVoidSquare.y + movingVoidSquare.height/2);
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance > 0) {
                            // 끌림 속도 (거리가 가까울수록 빠름, 더 강력하게)
                            const pullSpeed = Math.max(1.0, 5 - distance / 80);
                            const pullX = (dx / distance) * pullSpeed;
                            const pullY = (dy / distance) * pullSpeed;
                            
                            // 움직이는 공허 블럭을 끌림
                            movingVoidSquare.velocityX += pullX;
                            movingVoidSquare.velocityY += pullY;
                            
                            // 속도 제한 (더 빠르게)
                            const maxSpeed = 8;
                            const currentSpeed = Math.sqrt(movingVoidSquare.velocityX * movingVoidSquare.velocityX + movingVoidSquare.velocityY * movingVoidSquare.velocityY);
                            if (currentSpeed > maxSpeed) {
                                movingVoidSquare.velocityX = (movingVoidSquare.velocityX / currentSpeed) * maxSpeed;
                                movingVoidSquare.velocityY = (movingVoidSquare.velocityY / currentSpeed) * maxSpeed;
                            }
                        }
                    }
                    
                    // 다른 블럭과 충돌하면 흡수 (공허블럭처럼 완전히 없애버림)
                    this.smallSquares.forEach((otherSquare, otherIndex) => {
                        if (otherIndex !== movingVoidIndex && otherSquare !== this.draggedSquare && !otherSquare.isMovingVoid) {
                            // 식물의 경우 실제 크기 사용
                            const otherBounds = otherSquare.isPlant ? this.getPlantBounds(otherSquare) : otherSquare;
                            
                            // 충돌 감지 (더 넓은 범위로 설정)
                            if (movingVoidSquare.x - 5 < otherBounds.x + otherBounds.width &&
                                movingVoidSquare.x + movingVoidSquare.width + 5 > otherBounds.x &&
                                movingVoidSquare.y - 5 < otherBounds.y + otherBounds.height &&
                                movingVoidSquare.y + movingVoidSquare.height + 5 > otherBounds.y) {
                                
                                // 다른 블럭을 완전히 흡수 (제거) - 공허블럭처럼
                                this.smallSquares.splice(otherIndex, 1);
                            }
                        }
                    });
                }
            });
        }
        
        checkMagnetChestBoost() {
            // 자석장자의 가치 증가 타이머 시스템
            this.smallSquares.forEach(magnetChestSquare => {
                if (magnetChestSquare.isMagnetChest && magnetChestSquare.storedBlocks && magnetChestSquare.storedBlocks.length > 0) {
                    const storedBlock = magnetChestSquare.storedBlocks[0];
                    const currentTime = Date.now();
                    
                    // 2초마다 파티클 효과 활성화 (가치는 상점 구매가격과 동일)
                    if (currentTime - storedBlock.lastBoostTime >= 2000 && storedBlock.boostLevel < 1) {
                        storedBlock.boostLevel++;
                        storedBlock.lastBoostTime = currentTime;
                        console.log('자석장자 블럭 파티클 효과 활성화:', storedBlock.color);

        checkBoostedBlockParticles() {
            // 자석장자에서 꺼낸 파티클 효과 블럭에서 계속 노란 동그라미 생성
            this.smallSquares.forEach(square => {
                if (square.boostLevel >= 1) {
                    // 1초마다 노란 동그라미 파티클 생성
                    const currentTime = Date.now();
                    if (!square.lastParticleTime || currentTime - square.lastParticleTime >= 1000) {
                        square.lastParticleTime = currentTime;
                        
                        const centerX = square.x + square.width / 2;
                        const centerY = square.y + square.height / 2;
                        
                        // 노란 동그라미 파티클 3-5개 생성 (적당히)
                        const particleCount = 3 + Math.floor(Math.random() * 3);
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 1 + Math.random() * 2;
                            const size = 1 + Math.random() * 2;
                            
                            this.fireParticles.push({
                                x: centerX + (Math.random() - 0.5) * 10, // 블럭 주변에서 시작
                                y: centerY + (Math.random() - 0.5) * 10,
                                velocityX: Math.cos(angle) * speed,
                                velocityY: Math.sin(angle) * speed - 1, // 위로 살짝 올라가게
                                size: size,
                                color: '#ffff00', // 노란색
                                life: 20 + Math.random() * 15, // 20-35 프레임
                                maxLife: 20 + Math.random() * 15

                    }

        checkAdvanceBlockMovement() {
            // 전진 블럭이 판매 블럭 쪽으로 이동하는 기능
            this.smallSquares.forEach(square => {
                if (square.isAdvance) {
                    // 판매 블럭의 실제 위치와 크기 (화면 오른쪽)
                    const sellZoneX = this.canvas.width - 100; // 판매 블럭 중심 X
                    const sellZoneY = this.canvas.height - 100; // 판매 블럭 중심 Y
                    const sellZoneWidth = 80; // 판매 블럭 너비
                    const sellZoneHeight = 80; // 판매 블럭 높이
                    
                    // 판매 블럭의 경계 계산
                    const sellZoneLeft = sellZoneX - sellZoneWidth / 2;
                    const sellZoneRight = sellZoneX + sellZoneWidth / 2;
                    const sellZoneTop = sellZoneY - sellZoneHeight / 2;
                    const sellZoneBottom = sellZoneY + sellZoneHeight / 2;
                    
                    // 전진 블럭의 중심점
                    const advanceCenterX = square.x + square.width / 2;
                    const advanceCenterY = square.y + square.height / 2;
                    
                    // 판매 블럭과의 거리 계산 (가장 가까운 경계까지의 거리)
                    let dx, dy;
                    
                    if (advanceCenterX < sellZoneLeft) {
                        dx = sellZoneLeft - advanceCenterX;
                    } else if (advanceCenterX > sellZoneRight) {
                        dx = sellZoneRight - advanceCenterX;
                    } else {
                        dx = 0; // X축으로는 이미 판매 블럭 안에 있음
                    }
                    
                    if (advanceCenterY < sellZoneTop) {
                        dy = sellZoneTop - advanceCenterY;
                    } else if (advanceCenterY > sellZoneBottom) {
                        dy = sellZoneBottom - advanceCenterY;
                    } else {
                        dy = 0; // Y축으로는 이미 판매 블럭 안에 있음
                    }
                    
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // 판매 블럭에 완전히 닿을 때까지 이동
                    if (distance > 1) { // 1픽셀 이내로 접근하면 충분히 닿은 것으로 간주
                        // 판매 블럭 쪽으로 이동
                        const moveSpeed = 3; // 이동 속도 증가
                        square.velocityX = (dx / distance) * moveSpeed;
                        square.velocityY = (dy / distance) * moveSpeed;
                        
                        // 속도 제한
                        const maxSpeed = 4; // 최대 속도 증가
                        const currentSpeed = Math.sqrt(square.velocityX * square.velocityX + square.velocityY * square.velocityY);
                        if (currentSpeed > maxSpeed) {
                            square.velocityX = (square.velocityX / currentSpeed) * maxSpeed;
                            square.velocityY = (square.velocityY / currentSpeed) * maxSpeed;
                        }
                    } else {
                        // 판매 블럭에 닿았으면 속도를 0으로 설정
                        square.velocityX = 0;
                        square.velocityY = 0;
                    }
                }
            });
        }

                    this.smallSquares.forEach((otherSquare, otherIndex) => {
                        if (otherIndex !== soilIndex && otherSquare !== this.draggedSquare) {
                            // 충돌 감지
                            if (soilSquare.x < otherSquare.x + otherSquare.width &&
                                soilSquare.x + soilSquare.width > otherSquare.x &&
                                soilSquare.y < otherSquare.y + otherSquare.height &&
                                soilSquare.y + soilSquare.height > otherSquare.y) {

                                soilSquare.eatCount++;
                                soilSquare.width += 4;
                                soilSquare.height += 4;
                                if (soilSquare.width > 40) soilSquare.width = 40;
                                if (soilSquare.height > 40) soilSquare.height = 40;
                                
                                // 먹힌 네모 제거

            });

                        else if (square.isRainCloud) sellPrice = 25; // 비 구름
                        else if (square.isHailCloud) sellPrice = 30; // 우박 구름
                        else if (square.isSnowCloud) sellPrice = 28; // 눈 구름
                        else if (square.isSnow) sellPrice = 18; // 눈
                        else if (square.color === '#000000') sellPrice = 30; // 검은색

                        else if (square.isFruit) sellPrice = square.fruitValue; // 열매에서 변환된 블럭
                        
                        this.money += sellPrice;
                        this.smallSquares.splice(index, 1);
                    }
                }
            });
            
            // 열매 판매
            this.fruits.forEach((fruit, index) => {
                if (fruit.x < this.sellZone.x + this.sellZone.width &&
                    fruit.x + fruit.width > this.sellZone.x &&
                    fruit.y < this.sellZone.y + this.sellZone.height &&
                    fruit.y + fruit.height > this.sellZone.y) {
                    
                    this.money += fruit.value;
                    this.fruits.splice(index, 1);
                }
            });
        }

            this.smallSquares.forEach(square => {

                    for (let i = 0; i < 3; i++) {
                        this.fireParticles.push({
