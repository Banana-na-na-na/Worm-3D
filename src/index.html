<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>자동차</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #2a2c30;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #speed {
      position: fixed;
      left: 18px;
      bottom: 16px;
      margin: 0;
      color: #f4f4f6;
      font: 700 28px/1 "Segoe UI", sans-serif;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 0 #111;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <p id="speed">0 km/h</p>
  <script src="./game.js"></script>
</body>
</html>
