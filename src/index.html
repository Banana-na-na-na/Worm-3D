<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Game Starter</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <h1 class="title">AI 게임 제작 시뮬레이터</h1>
    <p class="hint">능력을 제작해서 인벤토리에 모으고, 슬롯에 장착해 플레이어를 강화하세요. 이동: WASD/방향키</p>
    <section class="layout">
      <section class="left-panel">
        <section class="controls" aria-label="AI 지시 패널">
          <button type="button" data-command="enemy">적 추가</button>
          <button type="button" data-command="wall">벽 생성</button>
          <button type="button" data-command="boost">플레이어 강화</button>
          <button type="button" data-command="goal">목표 생성</button>
          <button type="button" data-command="chaos">혼돈 패치</button>
        </section>
        <p id="aiLog" class="ai-log" aria-live="polite">AI: 명령 대기 중...</p>
        <canvas id="gameCanvas" width="960" height="540" aria-label="새 게임 캔버스"></canvas>
      </section>
      <aside class="ability-panel" aria-label="능력 관리 패널">
        <h2>능력 공방</h2>
        <div class="craft-box">
          <label for="abilityName">능력 이름</label>
          <input id="abilityName" type="text" maxlength="24" placeholder="예: 초고속 코어" />
          <label for="abilityPrompt">능력 설명(키워드)</label>
          <textarea id="abilityPrompt" rows="3" maxlength="120" placeholder="예: 매우 빠르고 날카로운 번개 같은 힘, 전설급"></textarea>
          <button id="craftAbilityBtn" type="button">능력 제작</button>
        </div>
        <section class="slot-box">
          <h3>장착 슬롯</h3>
          <div id="equipSlots" class="equip-slots"></div>
        </section>
        <section class="inventory-box">
          <h3>인벤토리</h3>
          <ul id="abilityInventory" class="inventory-list" aria-live="polite"></ul>
        </section>
      </aside>
    </section>
  </main>
  <script src="./game.js"></script>
</body>
</html>
