        draw() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            
            if (this.currentScreen === 'lab') {
                this.drawLab();
            } else if (this.currentScreen === 'shop') {
                this.drawShop();
        } else if (this.currentScreen === 'dev') {
            this.drawDev();
        } else if (this.currentScreen === 'chest') {
            this.drawChest();
            }
        }
        
        drawLab() {
            // 배경
            this.ctx.fillStyle = '#888';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            
            // 바닥 타일
            this.drawGroundTiles();
            
            // 터널
            this.ctx.fillStyle = '#a0a0a0';
            this.ctx.fillRect(this.tunnel.x, this.tunnel.y, this.tunnel.width, this.tunnel.height);
            this.ctx.strokeStyle = '#000000';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.tunnel.x, this.tunnel.y, this.tunnel.width, this.tunnel.height);
            
            // 빨간 버튼
            this.ctx.fillStyle = '#ff0000';
            this.ctx.fillRect(this.redButton.x, this.redButton.y, this.redButton.width, this.redButton.height);
            this.ctx.strokeStyle = '#000000';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.redButton.x, this.redButton.y, this.redButton.width, this.redButton.height);
            
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 12px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('빨강', this.redButton.x + this.redButton.width / 2, this.redButton.y + this.redButton.height / 2 + 4);
            this.ctx.fillText('무료', this.redButton.x + this.redButton.width / 2, this.redButton.y + this.redButton.height / 2 + 16);
            
            // 파란 버튼
            this.ctx.fillStyle = '#0000ff';
            this.ctx.fillRect(this.blueButton.x, this.blueButton.y, this.blueButton.width, this.blueButton.height);
            this.ctx.strokeStyle = '#000000';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.blueButton.x, this.blueButton.y, this.blueButton.width, this.blueButton.height);
            
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 12px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('파랑', this.blueButton.x + this.blueButton.width / 2, this.blueButton.y + this.blueButton.height / 2 + 4);
            this.ctx.fillText('$1', this.blueButton.x + this.blueButton.width / 2, this.blueButton.y + this.blueButton.height / 2 + 16);
            
            // 상점 버튼
            this.ctx.fillStyle = '#ff6b6b';
            this.ctx.fillRect(this.shopButton.x, this.shopButton.y, this.shopButton.width, this.shopButton.height);
            this.ctx.strokeStyle = '#000000';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.shopButton.x, this.shopButton.y, this.shopButton.width, this.shopButton.height);
            
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 12px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('블럭 상점', this.shopButton.x + this.shopButton.width / 2, this.shopButton.y + this.shopButton.height / 2 + 4);
            
            // 개발자 도구 버튼
            this.ctx.fillStyle = '#00ff00';
            this.ctx.fillRect(this.devButton.x, this.devButton.y, this.devButton.width, this.devButton.height);
            this.ctx.strokeStyle = '#000000';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.devButton.x, this.devButton.y, this.devButton.width, this.devButton.height);
            
            this.ctx.fillStyle = '#000000';
            this.ctx.font = 'bold 10px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('개발자', this.devButton.x + this.devButton.width / 2, this.devButton.y + this.devButton.height / 2 + 2);
            this.ctx.fillText('도구', this.devButton.x + this.devButton.width / 2, this.devButton.y + this.devButton.height / 2 + 12);
            
            // 작은 네모들 그리기
            this.smallSquares.forEach(square => {
                // 기본 네모 (공허 블럭이 아닌 경우만)
                if (!square.isVoid) {
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 검정 블럭에 특별한 표시 (공허와 구별)
                    if (square.color === '#000000' && !square.isVoid) {
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.font = 'bold 10px Arial';
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText('바이러스', square.x + square.width/2, square.y + square.height/2 + 3);
                    }
                }
                
                // 특수 효과들
                if (square.isSpecial) {
                    // 특성 네모는 강한 빛나는 효과 - 여러 번 그려서 진하게
                    this.ctx.save();
                    this.ctx.shadowColor = '#9370db';
                    this.ctx.shadowBlur = 30;
                    this.ctx.fillStyle = '#9370db';
                    
                    // 여러 번 그려서 블러 효과를 진하게
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    this.ctx.restore();
                    
                    // 추가로 테두리 효과
                    this.ctx.strokeStyle = '#000000';
                    this.ctx.lineWidth = 1;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                }
                
                if (square.isFire) {
                    // 불 네모는 빛나는 효과
                    this.ctx.save();
                    this.ctx.shadowColor = '#ffa500';
                    this.ctx.shadowBlur = 15;
                    this.ctx.fillStyle = '#ffa500';
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    this.ctx.restore();
                }
                
                if (square.isWater) {
                    // 물 네모는 반투명 효과
                    this.ctx.save();
                    this.ctx.globalAlpha = 0.7;
                    this.ctx.fillStyle = '#87ceeb';
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    this.ctx.restore();
                }
                
                if (square.isLight) {
                    // 빛 네모는 그라데이션 원형 효과
                    this.ctx.save();
                    const gradient = this.ctx.createRadialGradient(
                        square.x + square.width / 2, square.y + square.height / 2, 0,
                        square.x + square.width / 2, square.y + square.height / 2, 50
                    );
                    gradient.addColorStop(0, 'rgba(255, 255, 0, 0.8)');
                    gradient.addColorStop(1, 'rgba(255, 255, 0, 0)');
                    this.ctx.fillStyle = gradient;
                    
                    // 원형 그라데이션 배경
                    this.ctx.beginPath();
                    this.ctx.arc(square.x + square.width / 2, square.y + square.height / 2, 50, 0, Math.PI * 2);
                    this.ctx.fill();
                    

                    
                    this.ctx.restore();
                }
                
                if (square.isElectric) {
                    // 전기 네모는 작고 빛나는 효과
                    this.ctx.save();
                    this.ctx.shadowColor = '#00ffff';
                    this.ctx.shadowBlur = 10;
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x + 2, square.y + 2, square.width - 4, square.height - 4);
                    this.ctx.restore();
                }
                
                if (square.isSuperElectric) {
                    // 강력한 전기 네모는 남색으로 빛나는 효과
                    this.ctx.save();
                    this.ctx.shadowColor = '#4b0082';
                    this.ctx.shadowBlur = 15;
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    this.ctx.restore();
                }
                
                if (square.isSmoke) {
                    // 연기 네모는 회색
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                }
                
                if (square.isFog) {
                    // 안개 네모는 밝은 회색
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                }
                
                if (square.isCloud) {
                    // 구름 네모는 매우 밝은 회색
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                }
                
                if (square.isRainCloud) {
                    // 비 구름 네모는 어두운 회색
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                }
                
                if (square.isHailCloud) {
                    // 우박 구름 네모는 어두운 하늘색
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                }
                
                if (square.isSnowCloud) {
                    // 눈 구름 네모는 매우 밝은 회색
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                }
                
                if (square.isSnow) {
                    // 눈 네모는 하얀색
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                }
                
                if (square.isSoil) {
                    // 흙 네모는 갈색 점박이
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 갈색 점박이
                    this.ctx.fillStyle = '#8b4513';
                    for (let i = 0; i < 5; i++) {
                        const dotX = square.x + Math.random() * square.width;
                        const dotY = square.y + Math.random() * square.height;
                        this.ctx.fillRect(dotX, dotY, 2, 2);
                    }
                    
                    // 흙 네모 테두리
                    this.ctx.strokeStyle = '#654321';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                }
                
                if (square.isPlant) {
                    // 식물 네모는 성장 단계에 따라 위로 길어짐
                    const growth = square.plantGrowth || 1;
                    const growthHeight = 20 + (growth - 1) * 1; // 성장할 때마다 1픽셀씩 높아짐 (위로 길어짐)
                    const growthWidth = 20; // 너비는 고정
                    
                    // 식물이 위로 길어지도록 y 좌표 조정 (아래로 길어지지 않음)
                    const plantY = square.y + (20 - growthHeight); // 바닥에서 위로 자라나도록
                    
                    // 식물 네모는 연두색 효과 추가
                    this.ctx.fillStyle = square.color;
                    this.ctx.fillRect(square.x, plantY, growthWidth, growthHeight);
                    
                    // 식물 네모 테두리
                    this.ctx.strokeStyle = '#32cd32'; // 연두색
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, plantY - 1, growthWidth + 2, growthHeight + 2);
                    
                    // 성장 단계 표시 (50단계일 때만)
                    if (growth >= 50) {
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.font = 'bold 8px Arial';
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText('MAX', square.x + growthWidth/2, plantY + growthHeight/2 + 3);
                    }
                }
                
                if (square.isIce) {
                    // 얼음 네모는 하늘색에 반투명 효과
                    this.ctx.save();
                    this.ctx.globalAlpha = 0.8;
                    this.ctx.fillStyle = '#87ceeb';
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 얼음 네모 테두리 (얼음 같은 효과)
                    this.ctx.strokeStyle = '#b0e0e6';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                    this.ctx.restore();
                }
                
                if (square.isSpace) {
                    // 우주 네모는 진한 파란색에 별 효과
                    this.ctx.fillStyle = '#000080';
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 별 효과
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillRect(square.x + 2, square.y + 2, 2, 2);
                    this.ctx.fillRect(square.x + square.width - 4, square.y + 2, 2, 2);
                    this.ctx.fillRect(square.x + 2, square.y + square.height - 4, 2, 2);
                    this.ctx.fillRect(square.x + square.width - 4, square.y + square.height - 4, 2, 2);
                    this.ctx.fillRect(square.x + square.width/2 - 1, square.y + square.height/2 - 1, 2, 2);
                    
                    // 우주 네모 테두리
                    this.ctx.strokeStyle = '#4169e1';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                }
                else if (square.isVoid) {
                    // 공허 네모는 완벽한 검은색에 특별한 빛 효과
                    this.ctx.save();
                    
                    // 검은색 빛 효과 (그림자) - 더 강하게
                    this.ctx.shadowColor = '#000000';
                    this.ctx.shadowBlur = 25;
                    this.ctx.fillStyle = '#000000';
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 추가 빛 효과 - 더 강하게
                    this.ctx.shadowBlur = 40;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 공허 표시 (V)
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = 'bold 12px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('?', square.x + square.width/2, square.y + square.height/2 + 4);
                    
                    this.ctx.restore();
                    
                    // 공허 네모 테두리 (흰색으로 구별)
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                }
                else if (square.isMagnet) {
                    // 자석 네모는 갈색에 자석 효과
                    this.ctx.fillStyle = '#8b4513';
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 자석 효과 (N, S 표시)
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = 'bold 8px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('^', square.x + square.width/2, square.y + 8);
                    this.ctx.fillText('<>', square.x + square.width/2, square.y + square.height - 2);
                    
                    // 자석 네모 테두리
                    this.ctx.strokeStyle = '#654321';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                }
                
                if (square.isVirus) {
                    // 바이러스 네모는 자멘타색에 바이러스 효과
                    this.ctx.fillStyle = '#8b008b';
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 바이러스 효과 (V 표시)
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = 'bold 10px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('바이러스 404', square.x + square.width/2, square.y + square.height/2 + 3);
                    
                    // 바이러스 네모 테두리 (자멘타색)
                    this.ctx.strokeStyle = '#4b0082';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                }
                else if (square.isChest) {
                    // 상자 네모는 연한 갈색에 상자 효과
                    this.ctx.fillStyle = '#d2b48c';
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 상자 효과 (E 표시)
                    this.ctx.fillStyle = '#8b4513';
                    this.ctx.font = 'bold 10px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('상자', square.x + square.width/2, square.y + square.height/2 + 3);
                    
                    // 저장된 블럭 수 표시
                    if (square.storedBlocks && square.storedBlocks.length > 0) {
                        this.ctx.fillStyle = '#000000';
                        this.ctx.font = 'bold 8px Arial';
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText(square.storedBlocks.length.toString(), square.x + square.width/2, square.y + square.height - 2);
                    }
                    
                    // 상자 네모 테두리 (갈색)
                    this.ctx.strokeStyle = '#8b4513';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                }
                else if (square.isMagnetChest) {
                    // 자석장자는 연두색에 슬라임 모양
                    this.ctx.save();
                    
                    // 저장된 블럭의 가치 증가 확인
                    const storedBlock = square.storedBlocks && square.storedBlocks.length > 0 ? square.storedBlocks[0] : null;
                    const boostLevel = storedBlock ? storedBlock.boostLevel : 0;
                    const isMaxBoost = boostLevel >= 3;
                    
                    // 파티클 효과가 활성화되었을 때 노란색 글로우 효과
                    if (boostLevel >= 1) {
                        this.ctx.shadowColor = '#ffff00';
                        this.ctx.shadowBlur = 15;
                    }
                    
                    // 슬라임 모양을 위한 둥근 모서리
                    this.ctx.beginPath();
                    this.ctx.roundRect(square.x, square.y, square.width, square.height, 8);
                    this.ctx.fillStyle = '#32cd32';
                    this.ctx.fill();
                    
                    // 자석장자 효과 (EE 표시)
                    this.ctx.fillStyle = '#228b22';
                    this.ctx.font = 'bold 12px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('자석상자', square.x + square.width/2, square.y + square.height/2 + 4);
                    
                    // 저장된 블럭이 있으면 안에 표시
                    if (square.storedBlocks && square.storedBlocks.length > 0) {
                        const storedBlock = square.storedBlocks[0];
                        
                        // 반짝이 효과를 위한 시간 기반 애니메이션
                        const sparkleTime = Date.now() * 0.005;
                        const sparkleAlpha = 0.5 + 0.5 * Math.sin(sparkleTime);
                        
                        // 저장된 블럭을 자석장자 안에 작게 표시
                        this.ctx.fillStyle = storedBlock.color;
                        this.ctx.fillRect(square.x + 5, square.y + 5, 8, 8);
                        
                        // 반짝이 효과 (노란색 글로우)
                        this.ctx.save();
                        this.ctx.globalAlpha = sparkleAlpha;
                        this.ctx.fillStyle = '#ffff00';
                        this.ctx.fillRect(square.x + 4, square.y + 4, 10, 10);
                        this.ctx.restore();
                        
                        // 원래 블럭 다시 그리기 (반짝이 위에)
                        this.ctx.fillStyle = storedBlock.color;
                        this.ctx.fillRect(square.x + 5, square.y + 5, 8, 8);
                        
                        // 저장된 블럭의 특성 표시
                        if (storedBlock.isFire) {
                            this.ctx.fillStyle = '#ff0000';
                            this.ctx.fillRect(square.x + 5, square.y + 5, 3, 3);
                        } else if (storedBlock.isWater) {
                            this.ctx.fillStyle = '#0000ff';
                            this.ctx.fillRect(square.x + 5, square.y + 5, 3, 3);
                        } else if (storedBlock.isPlant) {
                            this.ctx.fillStyle = '#00ff00';
                            this.ctx.fillRect(square.x + 5, square.y + 5, 3, 3);
                        }
                        
                        // 반짝이 효과 (작은 별들)
                        this.ctx.save();
                        this.ctx.globalAlpha = sparkleAlpha * 0.8;
                        this.ctx.fillStyle = '#ffffff';
                        // 작은 별 4개
                        this.ctx.fillRect(square.x + 2, square.y + 2, 2, 2);
                        this.ctx.fillRect(square.x + 16, square.y + 2, 2, 2);
                        this.ctx.fillRect(square.x + 2, square.y + 16, 2, 2);
                        this.ctx.fillRect(square.x + 16, square.y + 16, 2, 2);
                        this.ctx.restore();
                    }
                    
                    // 자석장자 테두리 (연두색)
                    this.ctx.strokeStyle = '#228b22';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    
                    this.ctx.restore();
                }
                else if (square.isMovingVoid) {
                    // 움직이는 공허 네모는 어두운 빨강에 그라데이션 효과
                    this.ctx.save();
                    
                    // 검은색 빛 효과
                    this.ctx.shadowColor = '#000000';
                    this.ctx.shadowBlur = 20;
                    
                    // 어두운 빨강색 빛 효과
                    this.ctx.shadowColor = '#8b0000';
                    this.ctx.shadowBlur = 15;
                    
                    // 그라데이션 생성
                    const gradient = this.ctx.createRadialGradient(
                        square.x + square.width/2, square.y + square.height/2, 0,
                        square.x + square.width/2, square.y + square.height/2, square.width/2
                    );
                    gradient.addColorStop(0, '#8b0000'); // 어두운 빨강
                    gradient.addColorStop(0.7, '#4b0000'); // 더 어두운 빨강
                    gradient.addColorStop(1, '#000000'); // 검은색
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 움직이는 공허 효과 (조심하세요! 표시)
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = 'bold 8px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('조심하세요!', square.x + square.width/2, square.y + square.height/2 + 3);
                    
                    this.ctx.restore();
                    
                    // 움직이는 공허 네모 테두리 (어두운 빨강)
                    this.ctx.strokeStyle = '#4b0000';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                }
                else if (square.isAdvance) {
                    // 전진 블럭은 오렌지 레드색
                    this.ctx.fillStyle = '#ff4500';
                    this.ctx.fillRect(square.x, square.y, square.width, square.height);
                    
                    // 전진 효과 (→ 표시)
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = 'bold 12px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('→', square.x + square.width/2, square.y + square.height/2 + 4);
                    
                    // 전진 블럭 테두리 (오렌지)
                    this.ctx.strokeStyle = '#ff6500';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(square.x - 1, square.y - 1, square.width + 2, square.height + 2);
                }
            });
            
            // 불 네모 파티클 그리기
            this.fireParticles.forEach(particle => {
                const alpha = particle.life / particle.maxLife; // 페이드 아웃 효과
                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.fillStyle = particle.color;
                this.ctx.fillRect(particle.x - particle.size / 2, particle.y - particle.size / 2, particle.size, particle.size);
                this.ctx.restore();
            });
            
            // 물 네모 물방울 그리기
            this.waterDrops.forEach(drop => {
                const alpha = drop.life / drop.maxLife * 0.5; // 50% 반투명 + 페이드 아웃
                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.fillStyle = drop.color;
                this.ctx.fillRect(drop.x - drop.size / 2, drop.y - drop.size / 2, drop.size, drop.size);
                this.ctx.restore();
            });
            
            // 전기 네모 번개 파티클 그리기
            this.lightningParticles.forEach(particle => {
                const alpha = particle.life / particle.maxLife;
                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.strokeStyle = particle.color;
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                for (let i = 0; i < particle.points.length - 1; i++) {
                    this.ctx.moveTo(particle.points[i].x, particle.points[i].y);
                    this.ctx.lineTo(particle.points[i + 1].x, particle.points[i + 1].y);
                }
                this.ctx.stroke();
                this.ctx.restore();
            });
            
            // 강력한 전기 네모 번개 파티클 그리기
            this.superLightningParticles.forEach(particle => {
                const alpha = particle.life / particle.maxLife;
                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.strokeStyle = particle.color;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                for (let i = 0; i < particle.points.length - 1; i++) {
                    this.ctx.moveTo(particle.points[i].x, particle.points[i].y);
                    this.ctx.lineTo(particle.points[i + 1].x, particle.points[i + 1].y);
                }
                this.ctx.stroke();
                this.ctx.restore();
            });
            
            // 연기 네모 연기 파티클 그리기
            this.smokeCircles.forEach(circle => {
                const alpha = circle.life / circle.maxLife * 0.3; // 30% 반투명 + 페이드 아웃
                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.fillStyle = circle.color;
                this.ctx.beginPath();
                this.ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();
            });
            
            // 안개 네모 안개 파티클 그리기
            this.fogCircles.forEach(circle => {
                const alpha = circle.life / circle.maxLife * 0.4; // 40% 반투명 + 페이드 아웃
                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.fillStyle = circle.color;
                this.ctx.beginPath();
                this.ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();
            });
            
            // 비 구름 비 파티클 그리기
            this.rainDrops.forEach(drop => {
                const alpha = drop.life / drop.maxLife * 0.6;
                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.fillStyle = drop.color;
                this.ctx.fillRect(drop.x, drop.y, 2, 8);
                this.ctx.restore();
            });
            
            // 우박 구름 우박 파티클 그리기
            this.hailStones.forEach(stone => {
                const alpha = stone.life / stone.maxLife * 0.7;
                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.fillStyle = stone.color;
                this.ctx.beginPath();
                this.ctx.arc(stone.x, stone.y, stone.size, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();
            });
            
            // 눈 구름 눈 파티클 그리기
            this.snowFlakes.forEach(flake => {
                const alpha = flake.life / flake.maxLife * 0.5;
                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.fillStyle = flake.color;
                this.ctx.beginPath();
                this.ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();
            });
            
            // 열매 그리기
            this.fruits.forEach(fruit => {
                if (fruit.isGrowing) {
                    // 성장 중인 열매 - 반투명 효과
                    this.ctx.save();
                    this.ctx.globalAlpha = 0.8;
                    this.ctx.fillStyle = fruit.color;
                    this.ctx.fillRect(fruit.x, fruit.y, fruit.width, fruit.height);
                    
                    // 열매 테두리
                    this.ctx.strokeStyle = '#f0e68c';
                    this.ctx.lineWidth = 1;
                    this.ctx.strokeRect(fruit.x, fruit.y, fruit.width, fruit.height);
                    this.ctx.restore();
                } else {
                    // 떨어지는 열매 - 일반 렌더링
                    this.ctx.fillStyle = fruit.color;
                    this.ctx.fillRect(fruit.x, fruit.y, fruit.width, fruit.height);
                    
                    // 열매 테두리
                    this.ctx.strokeStyle = '#f0e68c';
                    this.ctx.lineWidth = 1;
                    this.ctx.strokeRect(fruit.x, fruit.y, fruit.width, fruit.height);
                }
            });
            
            // 판매 구역 그리기
            this.ctx.fillStyle = '#4169e1';
            this.ctx.fillRect(this.sellZone.x, this.sellZone.y, this.sellZone.width, this.sellZone.height);
            this.ctx.strokeStyle = '#0000ff';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.sellZone.x, this.sellZone.y, this.sellZone.width, this.sellZone.height);
            
            // 판매 구역 텍스트
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 16px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('판매', this.sellZone.x + this.sellZone.width / 2, this.sellZone.y + this.sellZone.height / 2 + 5);
            
            // 새로운 블럭 메시지 그리기
            if (this.newBlockMessageFrames > 0) {
                this.ctx.fillStyle = '#00ff7f'; // 민트색
                this.ctx.font = 'bold 24px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('새로운 블럭!', this.canvas.width / 2, this.canvas.height / 2);
            }
            
            
            // 돈 표시
            this.ctx.fillStyle = '#00ff00';
            this.ctx.font = 'bold 20px Arial';
            this.ctx.textAlign = 'right';
            this.ctx.fillText(`$${this.money}`, this.canvas.width - 20, 380);
        }
        
        drawShop() {
            // 상점 배경
            this.ctx.fillStyle = '#888';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            
            // 상점 제목
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 24px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('블럭 상점', this.canvas.width / 2, 40);
            
            // 상점 나가기 버튼
            this.ctx.fillStyle = '#ff6b6b';
            this.ctx.fillRect(this.exitShopButton.x, this.exitShopButton.y, this.exitShopButton.width, this.exitShopButton.height);
            this.ctx.strokeStyle = '#000000';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.exitShopButton.x, this.exitShopButton.y, this.exitShopButton.width, this.exitShopButton.height);
            
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 14px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('상점 나가기', this.exitShopButton.x + this.exitShopButton.width / 2, this.exitShopButton.y + this.exitShopButton.height / 2 + 5);
            
            // 상점 아이템들
            this.ctx.save();
            this.ctx.rect(50, 80, this.canvas.width - 100, this.canvas.height - 120);
            this.ctx.clip();
            
            let y = 100 + this.shopScrollY;
            this.shopItems.forEach((item, index) => {
                if (y > 80 && y < this.canvas.height - 40) {
                    // 아이템 배경
                    this.ctx.fillStyle = '#666';
                    this.ctx.fillRect(60, y - 20, this.canvas.width - 120, 40);
                    
                    // 아이템 색상 표시
                    this.ctx.fillStyle = item.color;
                    this.ctx.fillRect(70, y - 15, 30, 30);
                    
                    // 아이템 이름
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = '16px Arial';
                    this.ctx.textAlign = 'left';
                    this.ctx.fillText(item.name, 110, y + 5);
                    
                    // 가격 정보
                    this.ctx.fillStyle = '#ffff00';
                    this.ctx.font = '14px Arial';
                    this.ctx.textAlign = 'right';
                    this.ctx.fillText(`구매: $${item.buyPrice} | 판매: $${item.sellPrice}`, this.canvas.width - 70, y + 5);
                }
                y += 50;
            });
            
            this.ctx.restore();
            
            // 돈 표시
            this.ctx.fillStyle = '#00ff00';
            this.ctx.font = 'bold 20px Arial';
            this.ctx.textAlign = 'right';
            this.ctx.fillText(`$${this.money}`, this.canvas.width - 20, 380);
        }
        
        drawDev() {
            // 개발자 도구 배경
            this.ctx.fillStyle = '#1a1a1a';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            
            // 개발자 도구 제목
            this.ctx.fillStyle = '#00ff00';
            this.ctx.font = 'bold 24px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('개발자 도구', this.canvas.width / 2, 40);
            
            // 개발자 도구 나가기 버튼
            this.ctx.fillStyle = '#ff6b6b';
            this.ctx.fillRect(this.exitDevButton.x, this.exitDevButton.y, this.exitDevButton.width, this.exitDevButton.height);
            this.ctx.strokeStyle = '#000000';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.exitDevButton.x, this.exitDevButton.y, this.exitDevButton.width, this.exitDevButton.height);
            
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 14px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('나가기', this.exitDevButton.x + this.exitDevButton.width / 2, this.exitDevButton.y + this.exitDevButton.height / 2 + 5);
            
            // 설명
            this.ctx.fillStyle = '#cccccc';
            this.ctx.font = '14px Arial';
            this.ctx.textAlign = 'left';
            this.ctx.fillText('모든 블럭을 무료로 소환할 수 있습니다', 20, 70);
            
            // 개수 입력
            if (this.devInputFocused) {
                this.ctx.fillStyle = '#444444'; // 포커스된 상태는 더 밝게
                this.ctx.strokeStyle = '#00ff00'; // 포커스된 상태는 초록색 테두리
            } else {
                this.ctx.fillStyle = '#333333';
                this.ctx.strokeStyle = '#ffffff';
            }
            this.ctx.fillRect(this.devQuantityInput.x, this.devQuantityInput.y, this.devQuantityInput.width, this.devQuantityInput.height);
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.devQuantityInput.x, this.devQuantityInput.y, this.devQuantityInput.width, this.devQuantityInput.height);
            
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = '14px Arial';
            this.ctx.textAlign = 'center';
            // 0일 때는 빈 상태로 표시
            const displayText = this.devQuantity === 0 ? '' : this.devQuantity.toString();
            this.ctx.fillText(displayText, this.devQuantityInput.x + this.devQuantityInput.width/2, this.devQuantityInput.y + this.devQuantityInput.height/2 + 5);
            
            // 포커스 상태 표시
            if (this.devInputFocused) {
                this.ctx.fillStyle = '#00ff00';
                this.ctx.font = '10px Arial';
                this.ctx.textAlign = 'left';
                this.ctx.fillText('입력 중...', this.devQuantityInput.x, this.devQuantityInput.y - 5);
            }
            
            // 구매 버튼
            this.ctx.fillStyle = '#00ff00';
            this.ctx.fillRect(this.devBuyButton.x, this.devBuyButton.y, this.devBuyButton.width, this.devBuyButton.height);
            this.ctx.strokeStyle = '#ffffff';
            this.ctx.lineWidth = 1;
            this.ctx.strokeRect(this.devBuyButton.x, this.devBuyButton.y, this.devBuyButton.width, this.devBuyButton.height);
            
            this.ctx.fillStyle = '#000000';
            this.ctx.font = '12px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('구매', this.devBuyButton.x + this.devBuyButton.width/2, this.devBuyButton.y + this.devBuyButton.height/2 + 4);
            
            // 선택된 아이템 표시
            if (this.selectedDevItem) {
                this.ctx.fillStyle = '#ffff00';
                this.ctx.font = '12px Arial';
                this.ctx.textAlign = 'left';
                this.ctx.fillText(`선택: ${this.selectedDevItem.name}`, 20, 140);
            }
            
            // 개발자 도구 아이템들 - 간단하게 다시 만들기
            if (this.devItems && this.devItems.length > 0) {
                this.ctx.save();
                this.ctx.rect(50, 150, this.canvas.width - 100, this.canvas.height - 190);
                this.ctx.clip();
                
                let y = 170 + this.devScrollY;
                for (let i = 0; i < this.devItems.length; i++) {
                    const item = this.devItems[i];
                    
                    if (y > 150 && y < this.canvas.height - 40) {
                        // 선택된 아이템은 다른 색상으로 표시
                        if (this.selectedDevItem === item) {
                            this.ctx.fillStyle = '#666666'; // 선택된 아이템은 더 밝게
                        } else {
                            this.ctx.fillStyle = '#333333';
                        }
                        this.ctx.fillRect(60, y - 20, this.canvas.width - 120, 40);
                        
                        // 아이템 색상 표시
                        this.ctx.fillStyle = item.color;
                        this.ctx.fillRect(70, y - 15, 30, 30);
                        
                        // 아이템 이름
                        this.ctx.fillStyle = '#ffffff';
                        this.ctx.font = '16px Arial';
                        this.ctx.textAlign = 'left';
                        this.ctx.fillText(item.name, 110, y + 5);
                        
                        // 무료 표시
                        this.ctx.fillStyle = '#00ff00';
                        this.ctx.font = '14px Arial';
                        this.ctx.textAlign = 'right';
                        this.ctx.fillText('무료', this.canvas.width - 70, y + 5);
                    }
                    y += 50;
                }
                
                this.ctx.restore();
            }
        }
        
        drawChest() {
            // 상자 화면 배경
            this.ctx.fillStyle = '#d2b48c';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

            // 상자 화면 제목
            this.ctx.fillStyle = '#8b4513';
            this.ctx.font = 'bold 24px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('상자', this.canvas.width / 2, 40);

            // 상자 나가기 버튼
            this.ctx.fillStyle = '#ff6b6b';
            this.ctx.fillRect(this.exitChestButton.x, this.exitChestButton.y, this.exitChestButton.width, this.exitChestButton.height);
            this.ctx.strokeStyle = '#000000';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(this.exitChestButton.x, this.exitChestButton.y, this.exitChestButton.width, this.exitChestButton.height);

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 14px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('나가기', this.exitChestButton.x + this.exitChestButton.width / 2, this.exitChestButton.y + this.exitChestButton.height / 2 + 5);

            // 설명
            this.ctx.fillStyle = '#8b4513';
            this.ctx.font = '14px Arial';
            this.ctx.textAlign = 'left';
            this.ctx.fillText('저장된 블럭을 클릭하면 상자 위로 나옵니다', 20, 70);

            // 저장된 블럭 수 표시
            if (this.currentChest && this.currentChest.storedBlocks) {
                this.ctx.fillStyle = '#8b4513';
                this.ctx.font = '16px Arial';
                this.ctx.textAlign = 'left';
                this.ctx.fillText(`저장된 블럭: ${this.currentChest.storedBlocks.length}개`, 20, 100);
            }

            // 저장된 블럭들
            if (this.currentChest && this.currentChest.storedBlocks) {
                this.ctx.save();
                this.ctx.rect(50, 150, this.canvas.width - 100, this.canvas.height - 190);
                this.ctx.clip();

                let y = 170 + this.chestScrollY;
                this.currentChest.storedBlocks.forEach((storedBlock, index) => {
                    if (y > 150 && y < this.canvas.height - 40) {
                        // 아이템 배경
                        this.ctx.fillStyle = '#f5deb3';
                        this.ctx.fillRect(60, y - 20, this.canvas.width - 120, 40);

                        // 아이템 색상 표시
                        this.ctx.fillStyle = storedBlock.color;
                        this.ctx.fillRect(70, y - 15, 30, 30);

                        // 아이템 이름 (디버그 정보 포함)
                        let blockName = '일반 블럭';
                        if (storedBlock.isSpecial) blockName = '특성 블럭';
                        else if (storedBlock.isFire) blockName = '불 블럭';
                        else if (storedBlock.isWater) blockName = '물 블럭';
                        else if (storedBlock.isSoil) blockName = '토양 블럭';
                        else if (storedBlock.isPlant) blockName = '식물 블럭';
                        else if (storedBlock.isElectric) blockName = '전기 블럭';
                        else if (storedBlock.isSuperElectric) blockName = '강력한 전기 블럭';
                        else if (storedBlock.isLight) blockName = '빛 블럭';
                        else if (storedBlock.isIce) blockName = '얼음 블럭';
                        else if (storedBlock.isSpace) blockName = '우주 블럭';
                        else if (storedBlock.isVoid) blockName = '공허 블럭';
                        else if (storedBlock.isMagnet) blockName = '자석 블럭';
                        else if (storedBlock.isVirus) blockName = '바이러스 블럭';
                        else if (storedBlock.isChest) blockName = '상자 블럭';
                        else if (storedBlock.isMovingVoid) blockName = '움직이는 공허 블럭';
                        else if (storedBlock.isSmoke) blockName = '연기 블럭';
                        else if (storedBlock.isFog) blockName = '안개 블럭';
                        else if (storedBlock.isCloud) blockName = '구름 블럭';
                        else if (storedBlock.isRainCloud) blockName = '비 구름 블럭';
                        else if (storedBlock.isHailCloud) blockName = '우박 구름 블럭';
                        else if (storedBlock.isSnowCloud) blockName = '눈 구름 블럭';
                        else if (storedBlock.isSnow) blockName = '눈 블럭';
                        else if (storedBlock.isFruit) blockName = '열매 블럭';
                        
                        // 디버그: 저장된 블럭 정보 출력
                        console.log('저장된 블럭 정보:', {
                            color: storedBlock.color,
                            isSpecial: storedBlock.isSpecial,
                            isFire: storedBlock.isFire,
                            isWater: storedBlock.isWater,
                            blockName: blockName
                        });

                        this.ctx.fillStyle = '#8b4513';
                        this.ctx.font = '16px Arial';
                        this.ctx.textAlign = 'left';
                        this.ctx.fillText(blockName, 110, y + 5);

                        // 클릭 안내
                        this.ctx.fillStyle = '#8b4513';
                        this.ctx.font = '12px Arial';
                        this.ctx.textAlign = 'right';
                        this.ctx.fillText('클릭하여 꺼내기', this.canvas.width - 70, y + 5);
                    }
                    y += 50;
                });

                this.ctx.restore();
            }
        }
        
        drawGroundTiles() {
            const tileSize = 20;
            for (let x = 0; x < this.canvas.width; x += tileSize) {
                for (let y = this.ground.y; y < this.canvas.height; y += tileSize) {
                    if ((Math.floor(x / tileSize) + Math.floor(y / tileSize)) % 2 === 0) {
                        this.ctx.fillStyle = '#a0a0a0';
                    } else {
                        this.ctx.fillStyle = '#909090';
                    }
                    this.ctx.fillRect(x, y, tileSize, tileSize);
                }
            }
        }
        
        gameLoop() {
            if (this.gameRunning) {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }
    }
    
    // 게임 시작
    const game = new SimpleGame();
</script>
