<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로켓</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #bar-top,
    #bar-bottom {
      flex: 0 0 11%;
      background: #000;
      pointer-events: none;
    }
    #screen {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      background: #87b4dc;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #cross {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      pointer-events: none;
    }
    #cross::before,
    #cross::after {
      content: "";
      position: absolute;
      background: #fff;
    }
    #cross::before {
      left: 5px;
      top: 0;
      width: 2px;
      height: 12px;
    }
    #cross::after {
      left: 0;
      top: 5px;
      width: 12px;
      height: 2px;
    }
    #skill {
      position: absolute;
      left: 80%;
      top: 34%;
      z-index: 3;
      width: 76px;
      height: 100px;
      box-sizing: border-box;
      transform: translate(-50%, -50%);
      background: #3c3c42;
      border: 5px solid #1c1c20;
      color: #f2f2f4;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;
    }
    #skill canvas {
      width: 32px;
      height: 40px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #skill[hidden] {
      display: none;
    }
    #skill-cool {
      position: absolute;
      left: 80%;
      top: calc(34% + 56px);
      z-index: 3;
      width: 76px;
      height: 16px;
      box-sizing: border-box;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3c3c42;
      border: 4px solid #1c1c20;
      pointer-events: none;
    }
    #skill-cool[hidden] {
      display: none;
    }
    #skill-cool canvas {
      width: 68px;
      height: 8px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud {
      position: absolute;
      left: 16px;
      bottom: 14px;
      margin: 0;
      color: #f4f4f6;
      font: 700 18px/1.4 "Segoe UI", sans-serif;
      text-shadow: 0 2px 0 #111;
      pointer-events: none;
    }
    #ver {
      position: absolute;
      right: 16px;
      bottom: 14px;
      margin: 0;
      color: rgba(255, 255, 255, 0.55);
      font: 600 32px/1 "Segoe UI", sans-serif;
      pointer-events: none;
    }
    #fire {
      position: absolute;
      right: 28px;
      bottom: 28px;
      z-index: 6;
      width: 96px;
      height: 96px;
      margin: 0;
      padding: 0;
      border: 4px solid #111;
      border-radius: 50%;
      background: rgba(220, 36, 36, 0.94);
      color: #fff;
      font: 700 20px/1 "Segoe UI", sans-serif;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }
    #fire[hidden] {
      display: none;
    }
    #screen:has(#fire:not([hidden])) #ver {
      right: 28px;
      bottom: 140px;
    }
    #fuel-dock {
      position: absolute;
      right: 18px;
      top: 50%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      transform: translateY(-50%);
    }
    #fuel {
      position: relative;
      width: 28px;
      height: 220px;
      background: #000;
    }
    #fuel-fill {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 4px;
      top: 4px;
      background: rgb(220, 36, 36);
      transform-origin: bottom center;
      transform: scaleY(1);
    }
    #preview {
      display: block;
      width: 297px;
      height: 351px;
      margin-top: 10px;
      background: transparent;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #shop {
      position: absolute;
      left: 18px;
      top: 50%;
      z-index: 5;
      width: 300px;
      max-height: 78%;
      box-sizing: border-box;
      padding: 14px 14px 16px;
      transform: translateY(-50%);
      overflow: auto;
      background: #3c3c42;
      border: 5px solid #1c1c20;
      color: #f2f2f4;
      font: 700 16px/1.2 "Segoe UI", sans-serif;
    }
    #shop[hidden] {
      display: none;
    }
    #shop-title {
      margin: 0 0 4px;
      text-align: center;
      font-size: 22px;
    }
    #shop-money {
      margin: 0 0 12px;
      text-align: center;
    }
    #shop-rockets,
    #shop-ups {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #shop-ups {
      margin-top: 8px;
    }
    .shop-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 0;
      padding: 6px;
      box-sizing: border-box;
      border: 4px solid #1c1c20;
      background: #4a4a52;
      color: #f2f2f4;
      font: 700 16px/1.2 "Segoe UI", sans-serif;
      text-align: left;
      cursor: pointer;
    }
    .shop-row.poor {
      background: #2a2a2e;
      color: #7e7e86;
      cursor: default;
    }
    .shop-row.on {
      border-color: #f2f2f4;
    }
    .shop-row canvas {
      display: block;
      width: 84px;
      height: 62px;
      flex: 0 0 auto;
      pointer-events: none;
      background: transparent;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .shop-row .meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #cats {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 4;
      width: max-content;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      background: rgba(8, 8, 10, 0.88);
    }
    #cats[hidden] {
      display: none;
    }
    #cat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #cat-list button {
      margin: 0;
      padding: 6px;
      border: 3px solid #111;
      background: #1a1a1c;
      line-height: 0;
      cursor: pointer;
    }
    #cat-list button.on {
      border-color: rgb(220, 36, 36);
    }
    #cat-list canvas {
      display: block;
      width: 120px;
      height: 90px;
      pointer-events: none;
      background: transparent;
    }
    #cat-list .sub {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-left: 16px;
    }
    #cat-list .sub[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="bar-top"></div>
  <div id="screen">
    <canvas id="view"></canvas>
    <div id="cross"></div>
    <div id="skill" hidden><canvas id="skill-mark" width="16" height="20"></canvas></div>
    <div id="skill-cool" hidden><canvas id="skill-cool-fill" width="34" height="4"></canvas></div>
    <p id="hud">클릭해서 조종</p>
    <div id="cats" hidden>
      <div id="cat-list"></div>
    </div>
    <div id="shop" hidden>
      <p id="shop-title">상점</p>
      <p id="shop-money">0원</p>
      <div id="shop-rockets"></div>
      <div id="shop-ups"></div>
    </div>
    <div id="fuel-dock">
      <div id="fuel"><div id="fuel-fill"></div></div>
      <canvas id="preview"></canvas>
    </div>
    <p id="ver">v1.1.0</p>
    <button type="button" id="fire" hidden>발사</button>
  </div>
  <div id="bar-bottom"></div>
  <script src="./game.js?v=178"></script>
</body>
</html>
