<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로켓</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      height: 100%;
    }
    #clock {
      position: absolute;
      left: 50%;
      top: 8px;
      z-index: 6;
      margin: 0;
      transform: translateX(-50%);
      color: #fff;
      font: 700 28px/1 "Segoe UI", sans-serif;
      pointer-events: none;
    }
    #start {
      pointer-events: auto;
      position: absolute;
      left: 18px;
      top: 8px;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      color: #f4f4f6;
      font: 700 28px/1 "Segoe UI", sans-serif;
      cursor: pointer;
    }
    #screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87b4dc;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #cross {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      pointer-events: none;
    }
    #cross::before,
    #cross::after {
      content: "";
      position: absolute;
      background: #fff;
    }
    #cross::before {
      left: 5px;
      top: 0;
      width: 2px;
      height: 12px;
    }
    #cross::after {
      left: 0;
      top: 5px;
      width: 12px;
      height: 2px;
    }
    #hud {
      position: absolute;
      left: 16px;
      bottom: 14px;
      margin: 0;
      color: #f4f4f6;
      font: 700 18px/1.4 "Segoe UI", sans-serif;
      text-shadow: 0 2px 0 #111;
      pointer-events: none;
    }
    #ver {
      position: absolute;
      right: 16px;
      bottom: 14px;
      margin: 0;
      color: rgba(255, 255, 255, 0.55);
      font: 600 32px/1 "Segoe UI", sans-serif;
      pointer-events: none;
    }
    #fire {
      position: absolute;
      right: 28px;
      bottom: 28px;
      z-index: 6;
      width: 96px;
      height: 96px;
      margin: 0;
      padding: 0;
      border: 4px solid #111;
      border-radius: 50%;
      background: rgba(220, 36, 36, 0.94);
      color: #fff;
      font: 700 20px/1 "Segoe UI", sans-serif;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }
    #fire[hidden] {
      display: none;
    }
    #screen:has(#fire:not([hidden])) #ver {
      right: 28px;
      bottom: 140px;
    }
    #fuel-dock {
      position: absolute;
      right: 18px;
      top: 50%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      transform: translateY(-50%);
    }
    #preview {
      display: block;
      width: 297px;
      height: 351px;
      margin-top: 10px;
      background: transparent;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #cats {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 4;
      width: max-content;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      background: rgba(8, 8, 10, 0.88);
    }
    #cats[hidden] {
      display: none;
    }
    #cat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #cat-list button {
      margin: 0;
      padding: 6px;
      border: 3px solid #111;
      background: #1a1a1c;
      line-height: 0;
      cursor: pointer;
    }
    #cat-list button.on {
      border-color: rgb(220, 36, 36);
    }
    #cat-list canvas {
      display: block;
      width: 120px;
      height: 90px;
      pointer-events: none;
      background: transparent;
    }
    #cat-list .sub {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-left: 16px;
    }
    #cat-list .sub[hidden] {
      display: none;
    }
    #hotbar {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 6;
      display: flex;
      gap: 4px;
      transform: translateX(-50%);
      pointer-events: none;
    }
    #hp {
      position: absolute;
      left: 50%;
      bottom: 78px;
      z-index: 6;
      width: 230px;
      height: 16px;
      margin-left: -250px;
      box-sizing: border-box;
      border: 4px solid #1c1c20;
      background: #2a1012;
      pointer-events: none;
    }
    #hp-fill {
      width: 100%;
      height: 100%;
      background: #d42020;
    }
    .hot-slot {
      position: relative;
      width: 52px;
      height: 52px;
      box-sizing: border-box;
      border: 4px solid #1c1c20;
      background: rgba(20, 20, 24, 0.88);
    }
    .hot-slot.on {
      border-color: #f4f4f6;
    }
    .hot-cube {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 28px;
      height: 28px;
      box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.35);
    }
    .hot-cube[hidden] {
      display: none;
    }
    .hot-num {
      position: absolute;
      right: 4px;
      bottom: 2px;
      color: #fff;
      font: 700 16px/1 "Segoe UI", sans-serif;
      text-shadow: 1px 1px 0 #111, -1px 0 0 #111;
    }
    .hot-num[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="screen">
    <canvas id="view"></canvas>
    <p id="clock">20</p>
    <button type="button" id="start">시작</button>
    <div id="cross"></div>
    <p id="hud">클릭해서 조종</p>
    <div id="cats" hidden>
      <div id="cat-list"></div>
    </div>
    <div id="fuel-dock">
      <canvas id="preview"></canvas>
    </div>
    <p id="ver">v1.1.0</p>
    <div id="hp"><div id="hp-fill"></div></div>
    <div id="hotbar"></div>
    <button type="button" id="fire" hidden>발사</button>
  </div>
  <script src="./game.js?v=278"></script>
</body>
</html>
