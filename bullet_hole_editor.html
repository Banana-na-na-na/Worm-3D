<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>총자국 픽셀 아트 에디터</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #222;
            color: #fff;
        }
        h1 {
            margin-bottom: 10px;
        }
        .info {
            margin-bottom: 20px;
            text-align: center;
            color: #aaa;
        }
        .editor-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #555;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background: #333;
            cursor: crosshair;
            width: 320px;  /* 32픽셀 * 10배 확대 */
            height: 320px; /* 32픽셀 * 10배 확대 */
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            background: #333;
            border-radius: 10px;
            min-width: 280px;
        }
        .color-palette {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .color-btn {
            width: 60px;
            height: 60px;
            border: 3px solid #555;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.1s;
        }
        .color-btn:hover {
            transform: scale(1.1);
        }
        .color-btn.selected {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .tools {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            background: #555;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #666;
        }
        button:active {
            background: #444;
        }
        .current-color {
            width: 100%;
            height: 50px;
            border: 2px solid #555;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>총자국 픽셀 아트 에디터</h1>
    <div class="info">
        <p>총자국을 직접 그려보세요! (권장 크기: 32x32 픽셀)</p>
        <p>완성 후 "게임에 저장하기" 버튼을 누르면 자동으로 저장됩니다.</p>
    </div>
    
    <div class="editor-container">
        <div class="canvas-container">
            <canvas id="pixelCanvas" width="32" height="32"></canvas>
            <div id="sizeDisplay" style="margin-top: 10px; font-size: 12px; color: #aaa;">
                크기: 32 x 32 픽셀 (10배 확대 표시)
            </div>
            <div style="margin-top: 5px; font-size: 11px; color: #888;">
                각 픽셀을 정확하게 클릭하여 그릴 수 있습니다
            </div>
        </div>
        
        <div class="controls">
            <div>
                <div style="margin-bottom: 10px;">현재 색상:</div>
                <div class="current-color" id="currentColor"></div>
                <input type="color" id="colorPicker" value="#333333">
            </div>
            
            <div>
                <div style="margin-bottom: 10px;">색상 팔레트:</div>
                <div class="color-palette" id="colorPalette"></div>
            </div>
            
            <div class="tools">
                <button id="clearBtn">전체 지우기</button>
                <button id="fillBtn">채우기</button>
            </div>
            
            <div>
                <div style="margin-bottom: 10px;">
                    <div style="margin-bottom: 5px;">캔버스 크기:</div>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="number" id="canvasWidth" value="32" min="8" max="128" style="width: 60px; padding: 5px; background: #444; color: #fff; border: 1px solid #555; border-radius: 3px;">
                        <span>x</span>
                        <input type="number" id="canvasHeight" value="32" min="8" max="128" style="width: 60px; padding: 5px; background: #444; color: #fff; border: 1px solid #555; border-radius: 3px;">
                        <button id="resizeBtn" style="padding: 5px 10px; background: #555; color: #fff; border: none; border-radius: 3px; cursor: pointer;">적용</button>
                    </div>
                </div>
                <button id="saveBtn" style="width: 100%; background: #4CAF50;">이미지 저장</button>
                <button id="loadBtn" style="width: 100%; margin-top: 10px; background: #2196F3;">이미지 불러오기</button>
                <button id="copyBase64Btn" style="width: 100%; margin-top: 10px; background: #FF9800;">게임에 저장하기</button>
                <div style="margin-top: 10px; font-size: 11px; color: #aaa; text-align: center;">
                    버튼을 누르면 자동으로 저장됩니다!<br>게임을 새로고침하면 바로 적용됩니다
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const currentColorDiv = document.getElementById('currentColor');
        const colorPalette = document.getElementById('colorPalette');
        
        // 이미지 스무딩 비활성화 (픽셀 아트 스타일)
        ctx.imageSmoothingEnabled = false;
        
        let currentColor = '#333333';
        let isDrawing = false;
        let tool = 'draw';
        
        // 총자국 색상 팔레트
        const paletteColors = [
            '#111111', // 매우 어두운 회색
            '#222222', // 어두운 회색
            '#333333', // 중간 어두운 회색
            '#444444', // 중간 회색
            '#555555', // 밝은 회색
            '#000000', // 검은색
            '#1A1A1A', // 거의 검은색
            '#2A2A2A', // 어두운 회색
            '#3A3A3A', // 중간 어두운 회색
            '#4A4A4A', // 중간 회색
            '#FFFFFF', // 흰색 (하이라이트용)
            '#666666', // 밝은 회색
            '#777777', // 더 밝은 회색
            '#888888', // 밝은 회색
            '#999999', // 매우 밝은 회색
            '#AAAAAA'  // 거의 흰색
        ];
        
        // 색상 팔레트 생성
        paletteColors.forEach(color => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.backgroundColor = color;
            btn.addEventListener('click', () => {
                currentColor = color;
                colorPicker.value = color;
                updateCurrentColor();
                updatePaletteSelection();
            });
            colorPalette.appendChild(btn);
        });
        
        function updateCurrentColor() {
            currentColorDiv.style.backgroundColor = currentColor;
        }
        
        function updatePaletteSelection() {
            document.querySelectorAll('.color-btn').forEach((btn, index) => {
                if (paletteColors[index] === currentColor) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }
        
        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
            updateCurrentColor();
            updatePaletteSelection();
        });
        
        function drawPixel(x, y) {
            if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
                ctx.fillStyle = currentColor;
                ctx.fillRect(x, y, 1, 1);
            }
        }
        
        function getPixelCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);
            return {
                x: Math.max(0, Math.min(canvas.width - 1, x)),
                y: Math.max(0, Math.min(canvas.height - 1, y))
            };
        }
        
        function floodFill(startX, startY) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const targetColor = getPixelColor(data, startX, startY);
            const fillColor = hexToRgb(currentColor);
            
            if (colorsMatch(targetColor, fillColor)) return;
            
            const stack = [[startX, startY]];
            const visited = new Set();
            
            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const key = `${x},${y}`;
                
                if (visited.has(key)) continue;
                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                
                const pixelColor = getPixelColor(data, x, y);
                if (!colorsMatch(pixelColor, targetColor)) continue;
                
                visited.add(key);
                setPixelColor(data, x, y, fillColor);
                
                stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        function getPixelColor(data, x, y) {
            const index = (y * canvas.width + x) * 4;
            return {
                r: data[index],
                g: data[index + 1],
                b: data[index + 2],
                a: data[index + 3]
            };
        }
        
        function setPixelColor(data, x, y, color) {
            const index = (y * canvas.width + x) * 4;
            data[index] = color.r;
            data[index + 1] = color.g;
            data[index + 2] = color.b;
            data[index + 3] = 255;
        }
        
        function colorsMatch(c1, c2) {
            return c1.r === c2.r && c1.g === c2.g && c1.b === c2.b;
        }
        
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }
        
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getPixelCoordinates(e);
            
            if (tool === 'fill') {
                floodFill(pos.x, pos.y);
            } else {
                drawPixel(pos.x, pos.y);
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing && tool === 'draw') {
                const pos = getPixelCoordinates(e);
                drawPixel(pos.x, pos.y);
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });
        
        document.getElementById('fillBtn').addEventListener('click', () => {
            tool = tool === 'fill' ? 'draw' : 'fill';
            document.getElementById('fillBtn').textContent = tool === 'fill' ? '그리기' : '채우기';
        });
        
        document.getElementById('saveBtn').addEventListener('click', () => {
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'BulletHole.png';
                a.click();
                URL.revokeObjectURL(url);
                alert('이미지가 저장되었습니다!');
            });
        });
        
        document.getElementById('loadBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/png';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        });
        
        document.getElementById('copyBase64Btn').addEventListener('click', () => {
            const base64 = canvas.toDataURL('image/png');
            try {
                localStorage.setItem('bullet_hole_image_base64', base64);
                alert('✅ 총자국 이미지가 자동으로 저장되었습니다!\n\n게임을 새로고침하면 바로 적용됩니다.');
            } catch (e) {
                alert('저장 실패: ' + e.message);
            }
        });
        
        // 캔버스 크기 변경 기능
        function resizeCanvas() {
            const newWidth = parseInt(document.getElementById('canvasWidth').value);
            const newHeight = parseInt(document.getElementById('canvasHeight').value);
            
            if (newWidth < 8 || newWidth > 128 || newHeight < 8 || newHeight > 128) {
                alert('크기는 8~128 픽셀 사이여야 합니다.');
                return;
            }
            
            // 현재 이미지 저장
            const currentImage = canvas.toDataURL('image/png');
            
            // 캔버스 크기 변경
            canvas.width = newWidth;
            canvas.height = newHeight;
            ctx.imageSmoothingEnabled = false;
            
            // 기존 이미지 다시 그리기
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                updateSizeDisplay();
            };
            img.src = currentImage;
        }
        
        function updateSizeDisplay() {
            const sizeDisplay = document.getElementById('sizeDisplay');
            if (sizeDisplay) {
                sizeDisplay.textContent = `크기: ${canvas.width} x ${canvas.height} 픽셀 (10배 확대 표시)`;
            }
            // CSS 크기도 업데이트
            canvas.style.width = (canvas.width * 10) + 'px';
            canvas.style.height = (canvas.height * 10) + 'px';
        }
        
        document.getElementById('resizeBtn').addEventListener('click', resizeCanvas);
        
        // 저장된 이미지가 있으면 자동으로 불러오기
        try {
            const savedImage = localStorage.getItem('bullet_hole_image_base64');
            if (savedImage) {
                const img = new Image();
                img.onload = () => {
                    // 이미지 크기에 맞춰 캔버스 크기 조정
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.imageSmoothingEnabled = false;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    // 크기 입력 필드 업데이트
                    document.getElementById('canvasWidth').value = canvas.width;
                    document.getElementById('canvasHeight').value = canvas.height;
                    updateSizeDisplay();
                    console.log('저장된 총자국 이미지를 불러왔습니다!');
                };
                img.src = savedImage;
            } else {
                updateSizeDisplay();
            }
        } catch (e) {
            console.log('저장된 이미지 불러오기 실패:', e);
            updateSizeDisplay();
        }
        
        updateCurrentColor();
        updatePaletteSelection();
    </script>
</body>
</html>
